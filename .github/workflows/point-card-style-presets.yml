name: Apply point card style presets

on:
  push:
    branches:
      - codex/point-card-style-presets
    paths:
      - .github/workflows/point-card-style-presets.yml
      - .github/scripts/patch_point_card_styles.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/point-card-style-presets
          fetch-depth: 0

      - name: Apply point-card style patch
        run: python3 .github/scripts/patch_point_card_styles.py

      - name: Validate JavaScript and required behavior
        shell: bash
        run: |
          node --check MemberWebsocket-dev/admin/app.js
          node --check MemberWebsocket-dev/points/app.js
          node --check MemberWebsocket-dev/points/pointcard-ticket-overview.js
          python3 - <<'PY'
          from pathlib import Path

          membership = {'forest','midnight','ocean','sunset','lavender','rose','gold','platinum','mint','cherry'}
          point_cards = {'citrus','coral','lagoon','skyline','violet','berry','cocoa','lime','denim','peach'}
          assert len(point_cards) == 10
          assert not membership.intersection(point_cards)

          ticket_css = Path('MemberWebsocket-dev/points/pointcard-ticket-overview.css').read_text(encoding='utf-8')
          for rule in ['.ticket-cost-cards{', '@media(max-width:480px)', '@media(max-width:340px)']:
              assert rule in ticket_css, rule
          PY

      - name: Commit feature files
        shell: bash
        run: |
          rm .github/workflows/point-card-style-presets.yml .github/scripts/patch_point_card_styles.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(point-card): add distinct presets and matching ticket styles"
          git push origin HEAD:codex/point-card-style-presets
