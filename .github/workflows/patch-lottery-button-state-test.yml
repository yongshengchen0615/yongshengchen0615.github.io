name: Patch Lottery Button State Test

on:
  push:
    branches: ["agent/split-member-lottery-controller"]
    paths:
      - ".github/workflows/patch-lottery-button-state-test.yml"

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-member-lottery-controller
          fetch-depth: 0

      - name: Replace stale static disabled assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/tests/frontend-structure.test.js")
          text = path.read_text(encoding="utf-8")
          old = '  assert.match(spinButton, /\\bdisabled(?:\\s|>|=)/i);'
          new = '''  assert.doesNotMatch(spinButton, /\\bdisabled(?:\\s|>|=)/i);
          assert.match(
            script,
            /var\\s+buttonEnabled\\s*=\\s*canReveal\\s*\\|\\|\\s*canRetryPreparation[\\s\\S]*button\\.disabled\\s*=\\s*!buttonEnabled/
          );'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one static disabled assertion, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit dynamic button-state assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/tests/frontend-structure.test.js
          git commit -m "test: assert dynamic lottery button readiness"
          git push origin HEAD:agent/split-member-lottery-controller
