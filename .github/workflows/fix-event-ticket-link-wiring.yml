name: Fix Event Ticket Link Wiring

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-event-ticket-link-wiring.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove duplicate link script tags
        run: node MemberWebsocket-dev/scripts/fix-event-ticket-link-wiring.mjs
      - name: Validate
        run: |
          node --check MemberWebsocket-dev/admin/event-ticket-activity-link.js
          node --check MemberWebsocket-dev/event/activity-link.js
          node MemberWebsocket-dev/tests/event_ticket_activity_link.test.js
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MemberWebsocket-dev/admin/index.html MemberWebsocket-dev/event/index.html
          if git diff --cached --quiet; then
            echo 'No cleanup required.'
            exit 0
          fi
          git commit -m 'fix(event): load activity link scripts once'
          git push origin HEAD:main
