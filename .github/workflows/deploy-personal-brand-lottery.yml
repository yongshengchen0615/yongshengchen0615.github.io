name: Deploy Personal Brand Lottery Optimization

on:
  push:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/client/member-lottery-preload.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js"
      - ".github/workflows/deploy-personal-brand-lottery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-personal-brand-lottery
  cancel-in-progress: false

jobs:
  validate-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate preload module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/client/index.html")
          text = path.read_text(encoding="utf-8")
          marker = '<script defer src="member-lottery-preload.js"></script>'
          if marker not in text:
              target = '    <script defer src="member-lottery.js"></script>\n    <script defer src="script.js"></script>'
              replacement = '    <script defer src="member-lottery.js"></script>\n    <script defer src="member-lottery-preload.js"></script>\n    <script defer src="script.js"></script>'
              if target not in text:
                  raise SystemExit("Unable to locate the member lottery script order in client/index.html")
              path.write_text(text.replace(target, replacement, 1), encoding="utf-8")
          PY

      - name: Validate prepared lottery module
        run: |
          node --check PersonalBrandTestingEnvironment/client/member-lottery-preload.js
          node --test PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js

      - name: Validate activation order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("PersonalBrandTestingEnvironment/client/index.html").read_text(encoding="utf-8")
          expected = (
              '    <script defer src="member-lottery.js"></script>\n'
              '    <script defer src="member-lottery-preload.js"></script>\n'
              '    <script defer src="script.js"></script>'
          )
          if expected not in text:
              raise SystemExit("Prepared lottery module is not loaded between member-lottery.js and script.js")
          PY

      - name: Commit activation
        run: |
          if git diff --quiet; then
            echo "Preload module is already active."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/client/index.html
          git commit -m "deploy: activate prepared lottery flow"
          git pull --rebase origin main
          git push origin HEAD:main
