name: Validate and Activate Personal Brand Lottery Preload

on:
  pull_request:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/shared/module-registry.js"
      - "PersonalBrandTestingEnvironment/client/lottery/**"
      - "PersonalBrandTestingEnvironment/client/member-lottery-preload.js"
      - "PersonalBrandTestingEnvironment/tests/module-registry.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js"
      - ".github/workflows/deploy-personal-brand-lottery.yml"
  push:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/shared/module-registry.js"
      - "PersonalBrandTestingEnvironment/client/lottery/**"
      - "PersonalBrandTestingEnvironment/client/member-lottery-preload.js"
      - "PersonalBrandTestingEnvironment/tests/module-registry.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js"
      - ".github/workflows/deploy-personal-brand-lottery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-brand-lottery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate prepared lottery scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/client/index.html")
          text = path.read_text(encoding="utf-8")
          start_marker = '    <script defer src="../shared/lottery-wheel.js"></script>'
          end_marker = '    <script defer src="script.js"></script>'
          expected = "\n".join([
              start_marker,
              '    <script defer src="../shared/module-registry.js"></script>',
              '    <script defer src="member-lottery.js"></script>',
              '    <script defer src="lottery/contracts.js"></script>',
              '    <script defer src="lottery/pending-request-store.js"></script>',
              '    <script defer src="lottery/preparation-service.js"></script>',
              '    <script defer src="lottery/preparation-view.js"></script>',
              '    <script defer src="lottery/wheel-draw-guard.js"></script>',
              '    <script defer src="lottery/preload-controller.js"></script>',
              '    <script defer src="member-lottery-preload.js"></script>',
              end_marker,
          ])

          if expected not in text:
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(
                      "Unable to locate the member lottery script boundary in client/index.html"
                  )
              end += len(end_marker)
              path.write_text(
                  text[:start] + expected + text[end:],
                  encoding="utf-8",
              )
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check PersonalBrandTestingEnvironment/shared/module-registry.js
          node --check PersonalBrandTestingEnvironment/client/lottery/contracts.js
          node --check PersonalBrandTestingEnvironment/client/lottery/pending-request-store.js
          node --check PersonalBrandTestingEnvironment/client/lottery/preparation-service.js
          node --check PersonalBrandTestingEnvironment/client/lottery/preparation-view.js
          node --check PersonalBrandTestingEnvironment/client/lottery/wheel-draw-guard.js
          node --check PersonalBrandTestingEnvironment/client/lottery/preload-controller.js
          node --check PersonalBrandTestingEnvironment/client/member-lottery-preload.js

      - name: Run preload tests
        run: |
          node --test \
            PersonalBrandTestingEnvironment/tests/module-registry.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js

      - name: Validate dependency order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("PersonalBrandTestingEnvironment/client/index.html").read_text(
              encoding="utf-8"
          )
          expected = "\n".join([
              '    <script defer src="../shared/lottery-wheel.js"></script>',
              '    <script defer src="../shared/module-registry.js"></script>',
              '    <script defer src="member-lottery.js"></script>',
              '    <script defer src="lottery/contracts.js"></script>',
              '    <script defer src="lottery/pending-request-store.js"></script>',
              '    <script defer src="lottery/preparation-service.js"></script>',
              '    <script defer src="lottery/preparation-view.js"></script>',
              '    <script defer src="lottery/wheel-draw-guard.js"></script>',
              '    <script defer src="lottery/preload-controller.js"></script>',
              '    <script defer src="member-lottery-preload.js"></script>',
              '    <script defer src="script.js"></script>',
          ])
          if expected not in text:
              raise SystemExit("Lottery module dependency order is invalid")
          PY

      - name: Commit activated dependency order
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Prepared lottery scripts are already active."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/client/index.html
          git commit -m "deploy: activate prepared lottery modules"
          git push origin HEAD:main
