name: Validate and Activate Personal Brand Lottery V2

on:
  pull_request:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/shared/module-registry.js"
      - "PersonalBrandTestingEnvironment/client/lottery/**"
      - "PersonalBrandTestingEnvironment/client/member-lottery-v2.js"
      - "PersonalBrandTestingEnvironment/tests/**"
      - ".github/workflows/deploy-personal-brand-lottery.yml"
  push:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/shared/module-registry.js"
      - "PersonalBrandTestingEnvironment/client/lottery/**"
      - "PersonalBrandTestingEnvironment/client/member-lottery-v2.js"
      - "PersonalBrandTestingEnvironment/tests/**"
      - ".github/workflows/deploy-personal-brand-lottery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-brand-lottery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate member lottery v2 scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/client/index.html")
          text = path.read_text(encoding="utf-8")
          start_marker = '    <script defer src="../shared/lottery-wheel.js"></script>'
          end_marker = '    <script defer src="script.js"></script>'
          expected = "\n".join([
              start_marker,
              '    <script defer src="../shared/module-registry.js"></script>',
              '    <script defer src="lottery/contracts.js"></script>',
              '    <script defer src="lottery/pending-request-store.js"></script>',
              '    <script defer src="lottery/preparation-service.js"></script>',
              '    <script defer src="lottery/wheel-draw-guard.js"></script>',
              '    <script defer src="lottery/workspace-mapper.js"></script>',
              '    <script defer src="lottery/wheel-animator.js"></script>',
              '    <script defer src="lottery/dialog-view.js"></script>',
              '    <script defer src="lottery/demo-provider.js"></script>',
              '    <script defer src="lottery/dialog-controller.js"></script>',
              '    <script defer src="member-lottery-v2.js"></script>',
              end_marker,
          ])

          if expected not in text:
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(
                      "Unable to locate the member lottery script boundary in client/index.html"
                  )
              end += len(end_marker)
              path.write_text(
                  text[:start] + expected + text[end:],
                  encoding="utf-8",
              )
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check PersonalBrandTestingEnvironment/shared/module-registry.js
          node --check PersonalBrandTestingEnvironment/client/lottery/contracts.js
          node --check PersonalBrandTestingEnvironment/client/lottery/pending-request-store.js
          node --check PersonalBrandTestingEnvironment/client/lottery/preparation-service.js
          node --check PersonalBrandTestingEnvironment/client/lottery/wheel-draw-guard.js
          node --check PersonalBrandTestingEnvironment/client/lottery/workspace-mapper.js
          node --check PersonalBrandTestingEnvironment/client/lottery/wheel-animator.js
          node --check PersonalBrandTestingEnvironment/client/lottery/dialog-view.js
          node --check PersonalBrandTestingEnvironment/client/lottery/demo-provider.js
          node --check PersonalBrandTestingEnvironment/client/lottery/dialog-controller.js
          node --check PersonalBrandTestingEnvironment/client/member-lottery-v2.js

      - name: Run member lottery v2 tests
        run: |
          node --test \
            PersonalBrandTestingEnvironment/tests/member-lottery-v2.test.js \
            PersonalBrandTestingEnvironment/tests/workspace-mapper.test.js \
            PersonalBrandTestingEnvironment/tests/wheel-animator.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-v2-structure.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-activation-compatibility.test.js

      - name: Test module registry compatibility
        id: legacy_module_registry
        continue-on-error: true
        run: node --test PersonalBrandTestingEnvironment/tests/module-registry.test.js

      - name: Test preload compatibility
        id: legacy_preload
        continue-on-error: true
        run: node --test PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js

      - name: Test legacy dialog runtime
        id: legacy_runtime
        continue-on-error: true
        run: node --test PersonalBrandTestingEnvironment/tests/member-lottery-runtime.test.js

      - name: Test preload structure compatibility
        id: legacy_structure
        continue-on-error: true
        run: node --test PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js

      - name: Test legacy lottery motion
        id: legacy_motion
        continue-on-error: true
        run: node --test PersonalBrandTestingEnvironment/tests/lottery-motion.test.js

      - name: Verify legacy lottery compatibility tests
        if: always()
        run: |
          test "${{ steps.legacy_module_registry.outcome }}" = "success"
          test "${{ steps.legacy_preload.outcome }}" = "success"
          test "${{ steps.legacy_runtime.outcome }}" = "success"
          test "${{ steps.legacy_structure.outcome }}" = "success"
          test "${{ steps.legacy_motion.outcome }}" = "success"

      - name: Run remaining regression tests
        run: |
          mapfile -d '' tests < <(
            find PersonalBrandTestingEnvironment/tests -maxdepth 1 -name '*.test.js' \
              ! -name 'member-lottery-v2.test.js' \
              ! -name 'workspace-mapper.test.js' \
              ! -name 'wheel-animator.test.js' \
              ! -name 'lottery-v2-structure.test.js' \
              ! -name 'lottery-activation-compatibility.test.js' \
              ! -name 'module-registry.test.js' \
              ! -name 'member-lottery-preload.test.js' \
              ! -name 'member-lottery-runtime.test.js' \
              ! -name 'lottery-preload-structure.test.js' \
              ! -name 'lottery-motion.test.js' \
              -print0
          )
          node --test "${tests[@]}"

      - name: Run complete regression suite
        run: node --test PersonalBrandTestingEnvironment/tests/*.test.js

      - name: Validate dependency order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("PersonalBrandTestingEnvironment/client/index.html").read_text(
              encoding="utf-8"
          )
          expected = "\n".join([
              '    <script defer src="../shared/lottery-wheel.js"></script>',
              '    <script defer src="../shared/module-registry.js"></script>',
              '    <script defer src="lottery/contracts.js"></script>',
              '    <script defer src="lottery/pending-request-store.js"></script>',
              '    <script defer src="lottery/preparation-service.js"></script>',
              '    <script defer src="lottery/wheel-draw-guard.js"></script>',
              '    <script defer src="lottery/workspace-mapper.js"></script>',
              '    <script defer src="lottery/wheel-animator.js"></script>',
              '    <script defer src="lottery/dialog-view.js"></script>',
              '    <script defer src="lottery/demo-provider.js"></script>',
              '    <script defer src="lottery/dialog-controller.js"></script>',
              '    <script defer src="member-lottery-v2.js"></script>',
              '    <script defer src="script.js"></script>',
          ])
          if expected not in text:
              raise SystemExit("Member lottery v2 dependency order is invalid")
          PY

      - name: Commit activated dependency order
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Member lottery v2 scripts are already active."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/client/index.html
          git commit -m "deploy: activate member lottery v2"
          git push origin HEAD:main
