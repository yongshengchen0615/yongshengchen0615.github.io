name: Sync MemberTestingEnvironment Submodule Once

on:
  pull_request:
    paths:
      - ".github/workflows/sync-member-testing-submodule-once.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'yongshengchen0615/yongshengchen0615.github.io' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/sync-member-testing-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/sync-member-testing-20260811
          token: ${{ github.token }}
          submodules: recursive
          fetch-depth: 0
      - name: Advance MemberTestingEnvironment gitlink
        shell: bash
        run: |
          set -euo pipefail
          target='95c14b2e296c92e323b855af582ea4acd07197ee'
          git -C MemberTestingEnvironment fetch origin main
          git -C MemberTestingEnvironment cat-file -e "${target}^{commit}"
          git -C MemberTestingEnvironment checkout --detach "$target"
          test "$(git -C MemberTestingEnvironment rev-parse HEAD)" = "$target"
          git add MemberTestingEnvironment
          git diff --cached --submodule=short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Subproject commit ${target}"
          git push origin HEAD:fix/sync-member-testing-20260811
