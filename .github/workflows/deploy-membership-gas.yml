name: Deploy MembershipSystem GAS

on:
  push:
    branches: ["main"]
    paths:
      - "MembershipSystem/app/gas/**"
      - "MembershipSystem/app/shared/config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: membership-system-gas-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy GAS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Generate GAS integration configuration
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');
          const configPath = 'MembershipSystem/app/shared/config.json';
          const outputPath = 'MembershipSystem/app/gas/PointsCardIntegrationConfig.gs';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const raw = String(config.POINTS_CARD_GAS_WEB_APP_URL || '');
          let url;
          try {
            url = new URL(raw);
          } catch (_) {
            throw new Error('POINTS_CARD_GAS_WEB_APP_URL is not a valid URL');
          }
          if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' ||
              !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname) || url.search || url.hash) {
            throw new Error('POINTS_CARD_GAS_WEB_APP_URL must point to https://script.google.com/macros/s/<deploymentId>/exec');
          }
          fs.writeFileSync(outputPath, [
            "'use strict';",
            '// Generated from app/shared/config.json during deployment. Do not commit secrets here.',
            'const POINTS_CARD_MINUTE_GRANT_WEB_APP_URL = ' + JSON.stringify(url.toString()) + ';',
            ''
          ].join('\n'));
          NODE

      - name: Validate deployment secrets
        shell: bash
        env:
          GAS_SCRIPT_ID: ${{ secrets.MEMBERSHIP_GAS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.MEMBERSHIP_GAS_CLASPRC_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${GAS_SCRIPT_ID:-}" ]; then
            echo "::error::Missing GitHub Actions secret MEMBERSHIP_GAS_SCRIPT_ID."
            exit 1
          fi

          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "::error::Missing GitHub Actions secret MEMBERSHIP_GAS_CLASPRC_JSON."
            exit 1
          fi

          if ! [[ "$GAS_SCRIPT_ID" =~ ^[A-Za-z0-9_-]{20,}$ ]]; then
            echo "::error::MEMBERSHIP_GAS_SCRIPT_ID has an invalid format."
            exit 1
          fi

      - name: Validate GAS source
        shell: bash
        run: |
          set -euo pipefail

          GAS_DIR="MembershipSystem/app/gas"
          MANIFEST="$GAS_DIR/appsscript.json"

          node - "$MANIFEST" <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const webapp = manifest.webapp || {};
          if (webapp.access !== 'ANYONE_ANONYMOUS') {
            throw new Error('appsscript.json webapp.access must be ANYONE_ANONYMOUS for the LINE-authenticated public API endpoint');
          }
          if (webapp.executeAs !== 'USER_DEPLOYING') {
            throw new Error('appsscript.json webapp.executeAs must be USER_DEPLOYING so anonymous callers never become the Spreadsheet authorization principal');
          }
          NODE

          shopt -s nullglob
          gas_files=("$GAS_DIR"/*.gs)
          if [ "${#gas_files[@]}" -eq 0 ]; then
            echo "::error::No .gs files found under $GAS_DIR."
            exit 1
          fi

          for file in "${gas_files[@]}"; do
            tmp="$RUNNER_TEMP/$(basename "$file").js"
            cp "$file" "$tmp"
            node --check "$tmp"
          done

          # Apps Script loads every .gs file into one global scope. Individual
          # parsing cannot detect a duplicate top-level const in two tabs, so
          # parse the complete deployment bundle before clasp push.
          combined="$RUNNER_TEMP/membership-gas-combined.js"
          : > "$combined"
          for file in "${gas_files[@]}"; do
            printf '\n// Source: %s\n' "$file" >> "$combined"
            cat "$file" >> "$combined"
            printf '\n' >> "$combined"
          done
          node --check "$combined"

          for forbidden in .clasp.json .clasprc.json client_secret.json credentials.json service-account.json; do
            if [ -e "$GAS_DIR/$forbidden" ]; then
              echo "::error::Credential/config file must not be committed under $GAS_DIR: $forbidden"
              exit 1
            fi
          done

      - name: Resolve current Web App deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          deployment_id="$(node <<'NODE'
          const fs = require('fs');
          const path = 'MembershipSystem/app/shared/config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const raw = String(config.GAS_WEB_APP_URL || '');
          let url;
          try {
            url = new URL(raw);
          } catch (_) {
            throw new Error('GAS_WEB_APP_URL is not a valid URL');
          }
          if (url.protocol !== 'https:' || url.hostname !== 'script.google.com') {
            throw new Error('GAS_WEB_APP_URL must use https://script.google.com');
          }
          const match = url.pathname.match(/^\/macros\/s\/([^/]+)\/exec$/);
          if (!match) {
            throw new Error('GAS_WEB_APP_URL must point to a deployed /macros/s/<deploymentId>/exec URL');
          }
          process.stdout.write(match[1]);
          NODE
          )"

          if [ -z "$deployment_id" ]; then
            echo "::error::Unable to resolve GAS deployment ID from shared/config.json."
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Install pinned clasp
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @google/clasp@3.3.0
          ./node_modules/.bin/clasp --version

      - name: Prepare clasp configuration
        id: clasp
        shell: bash
        env:
          GAS_SCRIPT_ID: ${{ secrets.MEMBERSHIP_GAS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.MEMBERSHIP_GAS_CLASPRC_JSON }}
        run: |
          set -euo pipefail

          AUTH_FILE="$RUNNER_TEMP/.clasprc.json"
          PROJECT_FILE="$RUNNER_TEMP/.clasp.json"

          printf '%s' "$CLASPRC_JSON" > "$AUTH_FILE"
          chmod 600 "$AUTH_FILE"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$AUTH_FILE"

          node - "$PROJECT_FILE" "$GAS_SCRIPT_ID" "$GITHUB_WORKSPACE/MembershipSystem/app/gas" <<'NODE'
          const fs = require('fs');
          const [file, scriptId, rootDir] = process.argv.slice(2);
          fs.writeFileSync(file, JSON.stringify({ scriptId, rootDir }, null, 2));
          NODE

          echo "auth_file=$AUTH_FILE" >> "$GITHUB_OUTPUT"
          echo "project_file=$PROJECT_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify target deployment belongs to configured script
        shell: bash
        env:
          AUTH_FILE: ${{ steps.clasp.outputs.auth_file }}
          PROJECT_FILE: ${{ steps.clasp.outputs.project_file }}
          GAS_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail

          CLASP=(./node_modules/.bin/clasp -A "$AUTH_FILE" -P "$PROJECT_FILE")
          deployments="$("${CLASP[@]}" list-deployments)"
          printf '%s\n' "$deployments"

          if ! grep -Fq -- "$GAS_DEPLOYMENT_ID" <<< "$deployments"; then
            echo "::error::The deployment ID from MembershipSystem/app/shared/config.json does not belong to MEMBERSHIP_GAS_SCRIPT_ID. Refusing to push."
            exit 1
          fi

      - name: Show files that will be pushed
        shell: bash
        env:
          AUTH_FILE: ${{ steps.clasp.outputs.auth_file }}
          PROJECT_FILE: ${{ steps.clasp.outputs.project_file }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/clasp -A "$AUTH_FILE" -P "$PROJECT_FILE" show-file-status

      - name: Push GAS source
        shell: bash
        env:
          AUTH_FILE: ${{ steps.clasp.outputs.auth_file }}
          PROJECT_FILE: ${{ steps.clasp.outputs.project_file }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/clasp -A "$AUTH_FILE" -P "$PROJECT_FILE" push --force

      - name: Update existing Web App deployment
        shell: bash
        env:
          AUTH_FILE: ${{ steps.clasp.outputs.auth_file }}
          PROJECT_FILE: ${{ steps.clasp.outputs.project_file }}
          GAS_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/clasp -A "$AUTH_FILE" -P "$PROJECT_FILE" update-deployment "$GAS_DEPLOYMENT_ID" \
            --description "GitHub main ${GITHUB_SHA}"

      - name: Confirm deployment still exists
        shell: bash
        env:
          AUTH_FILE: ${{ steps.clasp.outputs.auth_file }}
          PROJECT_FILE: ${{ steps.clasp.outputs.project_file }}
          GAS_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail
          deployments="$(./node_modules/.bin/clasp -A "$AUTH_FILE" -P "$PROJECT_FILE" list-deployments)"
          if ! grep -Fq -- "$GAS_DEPLOYMENT_ID" <<< "$deployments"; then
            echo "::error::Deployment disappeared after update."
            exit 1
          fi
          printf '%s\n' "$deployments" | grep -F -- "$GAS_DEPLOYMENT_ID"

      - name: Verify public Web App health
        shell: bash
        env:
          GAS_DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail

          url="https://script.google.com/macros/s/${GAS_DEPLOYMENT_ID}/exec"
          response_file="$RUNNER_TEMP/membership-gas-health.json"
          success=false

          for attempt in 1 2 3 4 5; do
            http_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --output "$response_file" --write-out '%{http_code}' \
              "$url" || true)"

            if [ "$http_code" = "200" ] && node - "$response_file" <<'NODE'
          const fs = require('fs');
          try {
            const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            if (payload && payload.ok === true && payload.data && payload.data.service === 'MembershipSystem') {
              process.exit(0);
            }
          } catch (_) {}
          process.exit(1);
          NODE
            then
              success=true
              break
            fi

            sleep 3
          done

          if [ "$success" != "true" ]; then
            echo "::error::MembershipSystem GAS Web App is not publicly reachable as JSON. Verify the deployment access is Anyone, including anonymous, and execute-as is the deploying user."
            exit 1
          fi
