name: Patch Lottery Deep Link Test IDs

on:
  push:
    branches: ["agent/split-member-lottery-controller"]
    paths:
      - ".github/workflows/patch-lottery-deeplink-ids.yml"

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-member-lottery-controller
          fetch-depth: 0

      - name: Align deep-link test with current DOM IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/tests/frontend-structure.test.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'getOpeningTagById(html, "spin-button")': 'getOpeningTagById(html, "lottery-spin-button")',
              'getOpeningTagById(html, "lottery-wheel")': 'getOpeningTagById(html, "member-lottery-wheel")',
              'getOpeningTagById(html, "lottery-rotor")': 'getOpeningTagById(html, "member-lottery-rotor")',
              '/id=["\']ticket-earned-list["\']/' : '/id=["\']lottery-ticket-list["\']/',
              '/id=["\']ticket-locked-list["\']/' : '/id=["\']locked-ticket-list["\']/',
              '/id=["\']lottery-result["\']/' : '/id=["\']lottery-result-dialog["\']/',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit corrected test selectors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/tests/frontend-structure.test.js
          git commit -m "test: align legacy lottery selectors with current DOM"
          git push origin HEAD:agent/split-member-lottery-controller
