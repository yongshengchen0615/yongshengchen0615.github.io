name: Sync MemberTestingEnvironment Observer Fix Once

on:
  pull_request:
    paths:
      - ".github/workflows/sync-member-testing-observer-once.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'yongshengchen0615/yongshengchen0615.github.io' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/sync-member-testing-observer-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/sync-member-testing-observer-20260811
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Advance MemberTestingEnvironment gitlink
        shell: bash
        run: |
          set -euo pipefail
          git update-index --cacheinfo 160000,d205d61817e8344bd1b98d2c30592ddd5487942c,MemberTestingEnvironment
          rm .github/workflows/sync-member-testing-observer-once.yml
          git diff --cached -- MemberTestingEnvironment
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/sync-member-testing-observer-once.yml
          git commit -m "fix: publish stamp observer loop hotfix"
          git push origin HEAD:fix/sync-member-testing-observer-20260811
