name: Format Point Redemption Fix

on:
  push:
    branches:
      - "agent/fix-point-redemption-gas-error"
    paths:
      - ".github/workflows/agent-format-point-fix.yml"

permissions:
  contents: write

jobs:
  format-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-point-redemption-gas-error
          fetch-depth: 0

      - name: Format focused GAS changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/gas/client/Code.gs")
          text = path.read_text(encoding="utf-8")

          redeem_start = text.index("function redeemPointCampaign_(")
          mutation_start = text.index(
              "    var pointBalance = getMemberPointBalance_(", redeem_start
          )
          outer_catch = text.index("  } catch (error) {", mutation_start)
          mutation_block = "\n".join([
              "    var pointBalance = getMemberPointBalance_(",
              "      redemptionSheet,",
              "      identity.lineUserId",
              "    );",
              "    var preflightCardStatus = getMemberPointCardStatusForConfig_(",
              "      config,",
              "      identity.lineUserId,",
              "      redemptionSheet,",
              "      lotteryDrawSheet",
              "    );",
              "    if (preflightCardStatus.totalPoints !== pointBalance) {",
              "      throw appError_(",
              '        "POINT_DATA_ERROR",',
              '        "領點前的集點卡累計資料不一致。"',
              "      );",
              "    }",
              "    if (pointBalance > 9007199254740991 - campaign.points) {",
              '      throw appError_("POINT_DATA_ERROR", "會員點數資料超出可處理範圍。");',
              "    }",
              "    var balanceAfter = pointBalance + campaign.points;",
              "    var now = new Date();",
              "    var redemptionId =",
              '      "RDM-" + Utilities.getUuid().replace(/-/g, "").slice(0, 16).toUpperCase();',
              "    var redemptionAppended = false;",
              "",
              "    try {",
              "      redemptionSheet.appendRow([",
              "        redemptionId,",
              "        safeSheetText_(campaign.campaignId),",
              "        safeSheetText_(campaign.pointTypeId),",
              '        safeSheetText_(String(memberRow[MEMBER_COLUMN.memberId - 1] || "")),',
              "        safeSheetText_(identity.lineUserId),",
              "        campaign.points,",
              "        balanceAfter,",
              "        now,",
              "        request.requestId,",
              "        campaign.redemptionMode,",
              "      ]);",
              "      redemptionAppended = true;",
              "",
              "      var redemptionRowNumber = findPointRedemptionRowNumber_(",
              "        redemptionSheet,",
              "        redemptionId,",
              "        identity.lineUserId,",
              "        request.requestId",
              "      );",
              "      if (!redemptionRowNumber) {",
              "        throw appError_(",
              '          "POINT_DATA_ERROR",',
              '          "領點紀錄寫入後無法定位，請聯絡管理員。"',
              "        );",
              "      }",
              "      applyPointRedemptionRowFormats_(redemptionSheet, redemptionRowNumber);",
              "      SpreadsheetApp.flush();",
              "",
              "      var response = pointCampaignRedemptionResponseForConfig_(",
              "        config,",
              "        identity.lineUserId,",
              "        redemptionSheet,",
              "        lotteryDrawSheet,",
              "        access,",
              "        campaign,",
              '        "",',
              "        campaign.points",
              "      );",
              "      if (response.data.pointBalance !== balanceAfter) {",
              "        throw appError_(",
              '          "POINT_DATA_ERROR",',
              '          "領點後的集點卡累計資料不一致。"',
              "        );",
              "      }",
              "      return response;",
              "    } catch (redemptionError) {",
              "      if (redemptionAppended) {",
              "        var appendedRowNumber = findPointRedemptionRowNumber_(",
              "          redemptionSheet,",
              "          redemptionId,",
              "          identity.lineUserId,",
              "          request.requestId",
              "        );",
              "        if (!appendedRowNumber) {",
              "          throw appError_(",
              '            "POINT_DATA_ERROR",',
              '            "領點失敗且無法確認寫入狀態，請聯絡管理員。"',
              "          );",
              "        }",
              "        redemptionSheet.deleteRow(appendedRowNumber);",
              "        SpreadsheetApp.flush();",
              "      }",
              "      throw redemptionError;",
              "    }",
              "",
          ])
          text = text[:mutation_start] + mutation_block + text[outer_catch:]

          ledger_start = text.index("function readMemberPointLedger_(")
          loop_start = text.index("  rows.forEach(function (row) {", ledger_start)
          campaign_start = text.index("    var campaignId = plainSheetText_(", loop_start)
          ledger_prefix = "\n".join([
              "  rows.forEach(function (row) {",
              "    var storedLineUserId = plainSheetText_(",
              "      row[POINT_REDEMPTION_COLUMN.lineUserId - 1],",
              "      128",
              "    );",
              "    if (storedLineUserId !== lineUserId) return;",
              "",
              "    var redemptionId = plainSheetText_(",
              "      row[POINT_REDEMPTION_COLUMN.redemptionId - 1],",
              "      100",
              "    );",
              "    var requestId = plainSheetText_(",
              "      row[POINT_REDEMPTION_COLUMN.requestId - 1],",
              "      100",
              "    );",
              '    var requestKey = storedLineUserId + ":" + requestId;',
              "    if (",
              "      !/^RDM-[A-Z0-9]{16}$/.test(redemptionId) ||",
              "      !/^U[0-9a-f]{32}$/.test(storedLineUserId) ||",
              "      !/^[a-zA-Z0-9-]{10,80}$/.test(requestId) ||",
              "      redemptionIds[redemptionId] ||",
              "      requestKeys[requestKey]",
              "    ) {",
              "      throw appError_(",
              '        "POINT_DATA_ERROR",',
              '        "會員點數紀錄格式不正確，請聯絡管理員。"',
              "      );",
              "    }",
              "    redemptionIds[redemptionId] = true;",
              "    requestKeys[requestKey] = true;",
              "",
          ])
          text = text[:loop_start] + ledger_prefix + text[campaign_start:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run point claim regression suite
        run: |
          node --test \
            PersonalBrandTestingEnvironment/tests/point-contract.test.js \
            PersonalBrandTestingEnvironment/tests/client-claim-flow.test.js \
            PersonalBrandTestingEnvironment/tests/client-gas.test.js

      - name: Commit formatting correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/gas/client/Code.gs
          git commit -m "style: align point redemption GAS changes"
          git push origin HEAD:agent/fix-point-redemption-gas-error
