name: Trigger Point Redemption Fix

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/agent-fix-point-redemption.yml"
      - ".github/workflows/agent-trigger-point-fix.yml"

permissions:
  contents: write

jobs:
  execute-bootstrap:
    if: github.head_ref == 'agent/fix-point-redemption-gas-error'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply, test and push focused source changes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          bootstrap_path = Path(".github/workflows/agent-fix-point-redemption.yml")
          workflow_text = bootstrap_path.read_text(encoding="utf-8")

          def extract_script(start_marker, end_marker):
              start = workflow_text.index(start_marker) + len(start_marker)
              end = workflow_text.index(end_marker, start)
              raw = workflow_text[start:end]
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in raw.splitlines()
              ).strip("\n") + "\n"

          patch_script = extract_script(
              "      - name: Apply focused point redemption fix\n        run: |\n",
              "\n      - name: Add focused point claim CI workflow",
          )
          test_script = extract_script(
              "      - name: Run focused tests\n        run: |\n",
              "\n      - name: Commit and push focused fix",
          )

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", patch_script],
              check=True,
          )

          test_path = Path("PersonalBrandTestingEnvironment/tests/client-gas.test.js")
          tests = test_path.read_text(encoding="utf-8")
          old = (
              '      lineUserId: `U${"c".repeat(32)}`,\n'
              '      requestId: "request-other-member",'
          )
          new = '      requestId: "request-same-member-second",'
          if tests.count(old) != 1:
              raise SystemExit(
                  "Unable to update the target-member duplicate ID regression case"
              )
          test_path.write_text(tests.replace(old, new, 1), encoding="utf-8")

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", test_script],
              check=True,
          )
          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com",
              ],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "add",
                  "PersonalBrandTestingEnvironment/gas/client/Code.gs",
                  "PersonalBrandTestingEnvironment/tests/client-gas.test.js",
              ],
              check=True,
          )
          subprocess.run(
              ["git", "commit", "-m", "fix: stabilize point redemption GAS flow"],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "push",
                  "origin",
                  "HEAD:" + os.environ["HEAD_BRANCH"],
              ],
              check=True,
          )
          PY
