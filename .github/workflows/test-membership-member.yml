name: Test Membership Member

on:
  push:
    paths:
      - 'MembershipSystem/Member/**'
      - '.github/workflows/test-membership-member.yml'
  pull_request:
    paths:
      - 'MembershipSystem/Member/**'
      - '.github/workflows/test-membership-member.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Member tests
        run: node --test MembershipSystem/Member/tests/*.test.js
