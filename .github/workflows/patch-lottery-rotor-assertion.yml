name: Patch Lottery Rotor Assertion

on:
  push:
    branches: ["agent/split-member-lottery-controller"]
    paths:
      - ".github/workflows/patch-lottery-rotor-assertion.yml"

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/split-member-lottery-controller
          fetch-depth: 0

      - name: Correct rotor ID assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PersonalBrandTestingEnvironment/tests/frontend-structure.test.js")
          text = path.read_text(encoding="utf-8")
          old = 'assert.match(wheelRotor, /id=["\']lottery-rotor["\']/i);'
          new = 'assert.match(wheelRotor, /id=["\']member-lottery-rotor["\']/i);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one stale rotor assertion, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit corrected rotor assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/tests/frontend-structure.test.js
          git commit -m "test: assert current lottery rotor id"
          git push origin HEAD:agent/split-member-lottery-controller
