# one-time retrigger: 2026-08-06T11:10+08:00
name: Trigger Personal Brand UI UX Batch One

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-personal-brand-ui.yml"
      - ".github/workflows/agent-trigger-ui-ux-batch-one.yml"

permissions:
  contents: write

jobs:
  execute-bootstrap:
    if: github.head_ref == 'agent/improve-ui-ux-batch-one'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply, test and expose focused UI commit
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          workflow_path = Path(".github/workflows/validate-personal-brand-ui.yml")
          workflow_text = workflow_path.read_text(encoding="utf-8")
          start_marker = (
              "      - name: Apply focused UI UX improvements\n"
              "        run: |\n"
          )
          end_marker = "\n      - name: Check JavaScript syntax"
          start = workflow_text.index(start_marker) + len(start_marker)
          end = workflow_text.index(end_marker, start)
          raw_patch = workflow_text[start:end]
          patch_script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_patch.splitlines()
          ).strip("\n") + "\n"

          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", patch_script],
              check=True,
          )

          client_css_path = Path(
              "PersonalBrandTestingEnvironment/client/styles.css"
          )
          client_css = client_css_path.read_text(encoding="utf-8")
          client_css = client_css.replace(
              "background: color-mix(in srgb, var(--paper-soft) 86%, transparent);",
              "background: var(--paper-soft);",
          )
          client_css_path.write_text(client_css, encoding="utf-8")

          js_files = sorted(
              Path("PersonalBrandTestingEnvironment").rglob("*.js")
          )
          if not js_files:
              raise SystemExit("No JavaScript files found for syntax validation")
          for js_file in js_files:
              subprocess.run(
                  ["node", "--check", str(js_file)],
                  check=True,
              )

          test_files = sorted(
              Path("PersonalBrandTestingEnvironment/tests").glob("*.test.js")
          )
          if not test_files:
              raise SystemExit("No test files found")
          subprocess.run(
              ["node", "--test", *[str(path) for path in test_files]],
              check=True,
          )

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com",
              ],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "add",
                  "PersonalBrandTestingEnvironment/client/index.html",
                  "PersonalBrandTestingEnvironment/client/styles.css",
                  "PersonalBrandTestingEnvironment/admin/styles.css",
                  "PersonalBrandTestingEnvironment/tests/ui-ux-baseline.test.js",
              ],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "commit",
                  "-m",
                  "feat: improve member action hierarchy and busy feedback",
              ],
              check=True,
          )
          source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          print("VERIFIED_SOURCE_COMMIT_SHA=" + source_sha, flush=True)
          subprocess.run(
              [
                  "git",
                  "push",
                  "origin",
                  "HEAD:" + os.environ["HEAD_BRANCH"],
              ],
              check=True,
          )
          print("PUSHED_SOURCE_COMMIT_SHA=" + source_sha, flush=True)
          PY
