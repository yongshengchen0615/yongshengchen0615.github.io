name: Cleanup MemberTesting Sync Once

on:
  pull_request:
    paths:
      - ".github/workflows/cleanup-member-testing-sync-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'yongshengchen0615/yongshengchen0615.github.io' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cleanup/member-testing-sync-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only temporary branches from this incident
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in 'fix/sync-member-testing-20260811' 'cleanup/member-testing-sync-20260811'; do
            encoded="$(BRANCH="$branch" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe=""))')"
            status="$(curl -sS -o /tmp/delete-ref.out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")"
            if [[ "$status" != "204" && "$status" != "422" ]]; then
              cat /tmp/delete-ref.out
              echo "::error::Could not delete ${branch}; HTTP ${status}"
              exit 1
            fi
            echo "Deleted ${branch} (or it was already absent)."
          done
