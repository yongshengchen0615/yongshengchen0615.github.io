name: Publish Member Stamp Performance Once

on:
  pull_request:
    paths:
      - ".github/workflows/publish-member-stamp-performance-once.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'yongshengchen0615/yongshengchen0615.github.io' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/publish-member-stamp-performance-20260811'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/publish-member-stamp-performance-20260811
          fetch-depth: 0
      - name: Advance MemberTestingEnvironment gitlink
        shell: bash
        run: |
          set -euo pipefail
          target="a897b57652b94a4cb35cb02e685d500d1b618950"
          git update-index --cacheinfo 160000,"${target}",MemberTestingEnvironment
          rm -f .github/workflows/publish-member-stamp-performance-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: publish member Stamp Card performance hotfix"
          git push origin HEAD:fix/publish-member-stamp-performance-20260811
