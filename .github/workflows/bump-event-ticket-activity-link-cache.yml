name: Bump Event Ticket Activity Link Cache

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bump-event-ticket-activity-link-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bump activity link cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('MemberWebsocket-dev/admin/index.html'): (
                  'event-ticket-activity-link-20260911',
                  'event-ticket-activity-link-20260911-2',
              ),
              Path('MemberWebsocket-dev/event/index.html'): (
                  'event-ticket-activity-link-20260911',
                  'event-ticket-activity-link-20260911-2',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old}, got {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          grep -q 'event-ticket-activity-link-20260911-2' MemberWebsocket-dev/admin/index.html
          grep -q 'event-ticket-activity-link-20260911-2' MemberWebsocket-dev/event/index.html
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MemberWebsocket-dev/admin/index.html MemberWebsocket-dev/event/index.html
          git commit -m 'chore(event-ticket): bump activity link cache key'
          git push origin HEAD:main
