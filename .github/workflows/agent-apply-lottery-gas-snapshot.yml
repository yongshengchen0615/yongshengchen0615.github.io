name: Agent Apply Lottery GAS Snapshot Patch

on:
  push:
    branches:
      - "agent/lottery-runtime-prewarm-and-gas-read-optimization"
    paths:
      - ".github/agent/patch-lottery-gas-snapshot.js"
      - ".github/workflows/agent-apply-lottery-gas-snapshot.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'yongshengchen0615/yongshengchen0615.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact guarded source patches
        run: node .github/agent/patch-lottery-gas-snapshot.js

      - name: Validate patched syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          cp PersonalBrandTestingEnvironment/gas/client/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node --check PersonalBrandTestingEnvironment/tests/client-gas.test.js
          node --check PersonalBrandTestingEnvironment/tests/frontend-structure.test.js
          node --check PersonalBrandTestingEnvironment/tests/lottery-activation-compatibility.test.js
          node --check PersonalBrandTestingEnvironment/tests/project-quality.test.js
          node --check PersonalBrandTestingEnvironment/tests/member-lottery-loader.test.js
          node --check PersonalBrandTestingEnvironment/tests/member-lottery-runtime-prewarm.test.js
          git diff --check

      - name: Commit guarded patch result
        shell: bash
        run: |
          set -euo pipefail
          git add \
            PersonalBrandTestingEnvironment/gas/client/Code.gs \
            PersonalBrandTestingEnvironment/tests/client-gas.test.js \
            PersonalBrandTestingEnvironment/tests/frontend-structure.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-activation-compatibility.test.js \
            PersonalBrandTestingEnvironment/tests/project-quality.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-loader.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-runtime-prewarm.test.js
          if git diff --cached --quiet; then
            echo "Guarded patches are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve historical lottery mappings and lazy runtime contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
