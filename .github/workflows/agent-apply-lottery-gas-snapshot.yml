name: Agent Apply Lottery GAS Snapshot Patch

on:
  push:
    branches:
      - "agent/lottery-runtime-prewarm-and-gas-read-optimization"
    paths:
      - ".github/agent/patch-lottery-gas-snapshot.js"
      - ".github/workflows/agent-apply-lottery-gas-snapshot.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'yongshengchen0615/yongshengchen0615.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact GAS source patch
        run: node .github/agent/patch-lottery-gas-snapshot.js

      - name: Validate patched syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          cp PersonalBrandTestingEnvironment/gas/client/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
          git diff --exit-code -- PersonalBrandTestingEnvironment/gas/client/Code.gs && {
            echo "Expected the guarded patch to modify Code.gs" >&2
            exit 1
          }

      - name: Commit guarded patch result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/gas/client/Code.gs
          git commit -m "Preserve historical lottery mappings with settings snapshot"
          git push origin HEAD:${GITHUB_REF_NAME}
