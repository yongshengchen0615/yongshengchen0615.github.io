      - "PersonalBrandTestingEnvironment/tests/member-lottery-loader.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-refresh-state.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-runtime.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-runtime-prewarm.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-v2.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-gas-read-optimization.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-v2-structure.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-activation-compatibility.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-draw-service.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-motion.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-preparation-service.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-readiness-latency.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-workspace-events.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-workspace-service.test.js"
      - "PersonalBrandTestingEnvironment/tests/project-quality.test.js"
      - "PersonalBrandTestingEnvironment/tests/shared-ui-modules.test.js"
      - "PersonalBrandTestingEnvironment/tests/workspace-mapper.test.js"
      - "PersonalBrandTestingEnvironment/tests/wheel-animator.test.js"
      - ".github/agent/patch-lottery-gas-snapshot.js"
      - ".github/workflows/validate-personal-brand-lottery.yml"
  push:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/shared/lottery-wheel.js"
      - "PersonalBrandTestingEnvironment/shared/module-registry.js"
      - "PersonalBrandTestingEnvironment/client/index.html"
      - "PersonalBrandTestingEnvironment/client/lottery.html"
      - "PersonalBrandTestingEnvironment/client/script.js"
      - "PersonalBrandTestingEnvironment/client/styles.css"
      - "PersonalBrandTestingEnvironment/client/runtime-optimizations.css"
      - "PersonalBrandTestingEnvironment/client/member-lottery-loader.js"
      - "PersonalBrandTestingEnvironment/client/member-lottery-v2.js"
      - "PersonalBrandTestingEnvironment/client/lottery/**"
      - "PersonalBrandTestingEnvironment/gas/client/Code.gs"
      - "PersonalBrandTestingEnvironment/gas/client/PerformanceDiagnostics.gs"
      - "PersonalBrandTestingEnvironment/docs/LOTTERY_V2.md"
      - "PersonalBrandTestingEnvironment/docs/LOTTERY_READINESS_DIAGNOSTICS.md"
      - "PersonalBrandTestingEnvironment/tests/client-gas.test.js"
      - "PersonalBrandTestingEnvironment/tests/frontend-structure.test.js"
      - "PersonalBrandTestingEnvironment/tests/gas-performance-diagnostics.test.js"
      - "PersonalBrandTestingEnvironment/tests/module-registry.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-loader.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-refresh-state.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-runtime.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-runtime-prewarm.test.js"
      - "PersonalBrandTestingEnvironment/tests/member-lottery-v2.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-gas-read-optimization.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-v2-structure.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-activation-compatibility.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-draw-service.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-motion.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-preparation-service.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-readiness-latency.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-workspace-events.test.js"
      - "PersonalBrandTestingEnvironment/tests/lottery-workspace-service.test.js"
      - "PersonalBrandTestingEnvironment/tests/project-quality.test.js"
      - "PersonalBrandTestingEnvironment/tests/shared-ui-modules.test.js"
      - "PersonalBrandTestingEnvironment/tests/workspace-mapper.test.js"
      - "PersonalBrandTestingEnvironment/tests/wheel-animator.test.js"
      - ".github/workflows/validate-personal-brand-lottery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply guarded GAS snapshot patch once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/lottery-runtime-prewarm-and-gas-read-optimization'
        shell: bash
        run: |
          set -euo pipefail
          node .github/agent/patch-lottery-gas-snapshot.js
          cp PersonalBrandTestingEnvironment/gas/client/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PersonalBrandTestingEnvironment/gas/client/Code.gs
          if git diff --cached --quiet; then
            echo "GAS snapshot patch is already applied."
          else
            git commit -m "Preserve historical lottery mappings with settings snapshot"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lottery JavaScript and GAS syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            PersonalBrandTestingEnvironment/shared/lottery-wheel.js \
            PersonalBrandTestingEnvironment/shared/module-registry.js \
            PersonalBrandTestingEnvironment/client/member-lottery-loader.js \
            PersonalBrandTestingEnvironment/client/member-lottery-v2.js \
            PersonalBrandTestingEnvironment/client/script.js \
            PersonalBrandTestingEnvironment/client/lottery/*.js; do
            node --check "$file"
          done

          for file in PersonalBrandTestingEnvironment/gas/client/*.gs; do
            cp "$file" "/tmp/$(basename "$file" .gs).js"
            node --check "/tmp/$(basename "$file" .gs).js"
          done

      - name: Run lottery regression suite
        run: |
          node --test \
            PersonalBrandTestingEnvironment/tests/client-gas.test.js \
            PersonalBrandTestingEnvironment/tests/frontend-structure.test.js \
            PersonalBrandTestingEnvironment/tests/gas-performance-diagnostics.test.js \
            PersonalBrandTestingEnvironment/tests/module-registry.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-loader.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-preload.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-refresh-state.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-runtime.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-runtime-prewarm.test.js \
            PersonalBrandTestingEnvironment/tests/member-lottery-v2.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-gas-read-optimization.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-preload-structure.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-v2-structure.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-activation-compatibility.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-draw-service.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-motion.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-preparation-service.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-readiness-latency.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-workspace-events.test.js \
            PersonalBrandTestingEnvironment/tests/lottery-workspace-service.test.js \
            PersonalBrandTestingEnvironment/tests/project-quality.test.js \
            PersonalBrandTestingEnvironment/tests/shared-ui-modules.test.js \
            PersonalBrandTestingEnvironment/tests/workspace-mapper.test.js \
            PersonalBrandTestingEnvironment/tests/wheel-animator.test.js
