name: Validate Personal Brand Project

on:
  pull_request:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/**"
      - ".github/workflows/validate-personal-brand-project.yml"
  push:
    branches: ["main"]
    paths:
      - "PersonalBrandTestingEnvironment/**"
      - ".github/workflows/validate-personal-brand-project.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find PersonalBrandTestingEnvironment -type f -name '*.js' -print0 | sort -z)

      - name: Validate both GAS source files
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          while IFS= read -r -d '' file; do
            target="$temp_dir/$(basename "$(dirname "$file")")-$(basename "$file" .gs).js"
            cp "$file" "$target"
            node --check "$target"
          done < <(find PersonalBrandTestingEnvironment/gas -type f -name '*.gs' -print0 | sort -z)

      - name: Validate JSON configuration files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find PersonalBrandTestingEnvironment -type f -name '*.json' -print0 | sort -z)

      - name: Run complete regression suite
        run: node --test PersonalBrandTestingEnvironment/tests/*.test.js
