name: Bootstrap Point Redemption Fix

on:
  push:
    branches:
      - "agent/fix-point-redemption-gas-error"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused point redemption fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          code_path = Path("PersonalBrandTestingEnvironment/gas/client/Code.gs")
          text = code_path.read_text(encoding="utf-8")

          ledger_function = text.index("function readMemberPointLedger_(")
          ledger_loop = text.index("  rows.forEach(function (row) {", ledger_function)
          ledger_campaign = text.index(
              "    var campaignId = plainSheetText_(", ledger_loop
          )
          ledger_prefix = '''  rows.forEach(function (row) {
            var storedLineUserId = plainSheetText_(
              row[POINT_REDEMPTION_COLUMN.lineUserId - 1],
              128
            );
            if (storedLineUserId !== lineUserId) return;

            var redemptionId = plainSheetText_(
              row[POINT_REDEMPTION_COLUMN.redemptionId - 1],
              100
            );
            var requestId = plainSheetText_(
              row[POINT_REDEMPTION_COLUMN.requestId - 1],
              100
            );
            var requestKey = storedLineUserId + ":" + requestId;
            if (
              !/^RDM-[A-Z0-9]{16}$/.test(redemptionId) ||
              !/^U[0-9a-f]{32}$/.test(storedLineUserId) ||
              !/^[a-zA-Z0-9-]{10,80}$/.test(requestId) ||
              redemptionIds[redemptionId] ||
              requestKeys[requestKey]
            ) {
              throw appError_("POINT_DATA_ERROR", "會員點數紀錄格式不正確，請聯絡管理員。");
            }
            redemptionIds[redemptionId] = true;
            requestKeys[requestKey] = true;

          '''
          ledger_prefix = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in ledger_prefix.splitlines()
          ) + "\n"
          text = text[:ledger_loop] + ledger_prefix + text[ledger_campaign:]

          redeem_function = text.index("function redeemPointCampaign_(")
          mutation_start = text.index(
              "    var pointBalance = getMemberPointBalance_(", redeem_function
          )
          mutation_end = text.index("    return response;", mutation_start)
          mutation_end += len("    return response;\n")
          mutation_block = '''    var pointBalance = getMemberPointBalance_(
              redemptionSheet,
              identity.lineUserId,
              lotteryDrawSheet
            );
            var preflightCardStatus = getMemberPointCardStatusForConfig_(
              config,
              identity.lineUserId,
              redemptionSheet,
              lotteryDrawSheet
            );
            if (preflightCardStatus.totalPoints !== pointBalance) {
              throw appError_("POINT_DATA_ERROR", "領點前的集點卡累計資料不一致。");
            }
            if (pointBalance > 9007199254740991 - campaign.points) {
              throw appError_("POINT_DATA_ERROR", "會員點數資料超出可處理範圍。");
            }
            var balanceAfter = pointBalance + campaign.points;
            var now = new Date();
            var redemptionId =
              "RDM-" + Utilities.getUuid().replace(/-/g, "").slice(0, 16).toUpperCase();
            var redemptionAppended = false;

            try {
              redemptionSheet.appendRow([
                redemptionId,
                safeSheetText_(campaign.campaignId),
                safeSheetText_(campaign.pointTypeId),
                safeSheetText_(String(memberRow[MEMBER_COLUMN.memberId - 1] || "")),
                safeSheetText_(identity.lineUserId),
                campaign.points,
                balanceAfter,
                now,
                request.requestId,
                campaign.redemptionMode,
              ]);
              redemptionAppended = true;

              var redemptionRowNumber = findPointRedemptionRowNumber_(
                redemptionSheet,
                redemptionId,
                identity.lineUserId,
                request.requestId
              );
              if (!redemptionRowNumber) {
                throw appError_(
                  "POINT_DATA_ERROR",
                  "領點紀錄寫入後無法定位，請聯絡管理員。"
                );
              }
              applyPointRedemptionRowFormats_(redemptionSheet, redemptionRowNumber);
              SpreadsheetApp.flush();

              var response = pointCampaignRedemptionResponseForConfig_(
                config,
                identity.lineUserId,
                redemptionSheet,
                lotteryDrawSheet,
                access,
                campaign,
                "",
                campaign.points
              );
              if (response.data.pointBalance !== balanceAfter) {
                throw appError_("POINT_DATA_ERROR", "領點後的集點卡累計資料不一致。");
              }
              return response;
            } catch (redemptionError) {
              if (redemptionAppended) {
                var appendedRowNumber = findPointRedemptionRowNumber_(
                  redemptionSheet,
                  redemptionId,
                  identity.lineUserId,
                  request.requestId
                );
                if (!appendedRowNumber) {
                  throw appError_(
                    "POINT_DATA_ERROR",
                    "領點失敗且無法確認寫入狀態，請聯絡管理員。"
                  );
                }
                redemptionSheet.deleteRow(appendedRowNumber);
                SpreadsheetApp.flush();
              }
              throw redemptionError;
            }
          '''
          mutation_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in mutation_block.splitlines()
          ) + "\n"
          text = text[:mutation_start] + mutation_block + text[mutation_end:]

          helper_anchor = "function assertRedemptionMatchesCampaign_(redemptionRow, campaign) {"
          helper_index = text.index(helper_anchor)
          helper = '''function findPointRedemptionRowNumber_(
            sheet,
            redemptionId,
            lineUserId,
            requestId
          ) {
            var lastRow = sheet.getLastRow();
            if (lastRow < 2) return 0;

            var rows = sheet
              .getRange(2, 1, lastRow - 1, POINT_REDEMPTION_HEADERS.length)
              .getValues();
            var rowNumber = 0;
            for (var i = 0; i < rows.length; i += 1) {
              if (
                plainSheetText_(
                  rows[i][POINT_REDEMPTION_COLUMN.redemptionId - 1],
                  100
                ) !== redemptionId ||
                plainSheetText_(
                  rows[i][POINT_REDEMPTION_COLUMN.lineUserId - 1],
                  128
                ) !== lineUserId ||
                plainSheetText_(
                  rows[i][POINT_REDEMPTION_COLUMN.requestId - 1],
                  100
                ) !== requestId
              ) {
                continue;
              }
              if (rowNumber) {
                throw appError_(
                  "POINT_DATA_ERROR",
                  "同一領點寫入識別出現重複紀錄，請聯絡管理員。"
                );
              }
              rowNumber = i + 2;
            }
            return rowNumber;
          }

          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          ) + "\n"
          text = text[:helper_index] + helper + text[helper_index:]
          code_path.write_text(text, encoding="utf-8")

          test_path = Path("PersonalBrandTestingEnvironment/tests/client-gas.test.js")
          tests = test_path.read_text(encoding="utf-8")
          marker = 'test("point redemption ignores malformed rows owned by another member"'
          if marker not in tests:
              tests += r'''

test("point redemption ignores malformed rows owned by another member", () => {
  const gas = createGasContext();
  const otherLineUserId = `U${"c".repeat(32)}`;
  const redemptionRows = [
    createPointRedemptionRow(gas, {
      redemptionId: "legacy-invalid-id",
      memberId: "MBR-SECOND0000",
      lineUserId: otherLineUserId,
      requestId: "legacy-invalid-request",
    }),
  ];
  installPointSheets(gas, {
    memberRows: [createMemberRow(gas)],
    campaignRows: [createPointCampaignRow(gas)],
    redemptionRows,
  });

  const result = gas.redeemPointCampaign_(
    createIdentity(),
    {
      action: "redeemPointCampaign",
      requestId: "request-ignore-other-member",
      claim: POINT_CLAIM,
    },
    {}
  );

  assert.equal(result.data.redeemed, true);
  assert.equal(result.data.pointBalance, 3);
  assert.equal(redemptionRows.length, 2);
  assert.equal(
    redemptionRows[1][gas.POINT_REDEMPTION_COLUMN.lineUserId - 1],
    createIdentity().lineUserId
  );
});

test("point redemption rolls back its ledger row when response assembly fails", () => {
  const gas = createGasContext();
  const redemptionRows = [];
  installPointSheets(gas, {
    memberRows: [createMemberRow(gas)],
    campaignRows: [createPointCampaignRow(gas)],
    redemptionRows,
  });
  const originalResponseBuilder = gas.pointCampaignRedemptionResponseForConfig_;
  gas.pointCampaignRedemptionResponseForConfig_ = function (...args) {
    if (args[7] > 0) {
      throw gas.appError_(
        "POINT_CARD_DATA_ERROR",
        "forced response assembly failure"
      );
    }
    return originalResponseBuilder.apply(gas, args);
  };
  const request = {
    action: "redeemPointCampaign",
    requestId: "request-rollback-response",
    claim: POINT_CLAIM,
  };

  assert.throws(
    () => gas.redeemPointCampaign_(createIdentity(), request, {}),
    (error) => error.appCode === "POINT_CARD_DATA_ERROR"
  );
  assert.equal(redemptionRows.length, 0);

  gas.pointCampaignRedemptionResponseForConfig_ = originalResponseBuilder;
  const retry = gas.redeemPointCampaign_(createIdentity(), request, {});
  assert.equal(retry.data.redeemed, true);
  assert.equal(retry.data.pointBalance, 3);
  assert.equal(redemptionRows.length, 1);
});
'''
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Add focused point claim CI workflow
        run: |
          cat > .github/workflows/validate-personal-brand-points.yml <<'YAML'
          name: Validate Personal Brand Point Claims

          on:
            pull_request:
              branches: ["main"]
              paths:
                - "PersonalBrandTestingEnvironment/gas/client/Code.gs"
                - "PersonalBrandTestingEnvironment/client/script.js"
                - "PersonalBrandTestingEnvironment/shared/gas-api.js"
                - "PersonalBrandTestingEnvironment/tests/client-gas.test.js"
                - "PersonalBrandTestingEnvironment/tests/client-claim-flow.test.js"
                - "PersonalBrandTestingEnvironment/tests/point-contract.test.js"
                - ".github/workflows/validate-personal-brand-points.yml"
            push:
              branches: ["main"]
              paths:
                - "PersonalBrandTestingEnvironment/gas/client/Code.gs"
                - "PersonalBrandTestingEnvironment/client/script.js"
                - "PersonalBrandTestingEnvironment/shared/gas-api.js"
                - "PersonalBrandTestingEnvironment/tests/client-gas.test.js"
                - "PersonalBrandTestingEnvironment/tests/client-claim-flow.test.js"
                - "PersonalBrandTestingEnvironment/tests/point-contract.test.js"
                - ".github/workflows/validate-personal-brand-points.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 1
                    persist-credentials: false

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"

                - name: Run point claim regression suite
                  run: |
                    node --test \
                      PersonalBrandTestingEnvironment/tests/point-contract.test.js \
                      PersonalBrandTestingEnvironment/tests/client-claim-flow.test.js \
                      PersonalBrandTestingEnvironment/tests/client-gas.test.js
          YAML

      - name: Remove bootstrap workflow
        run: rm .github/workflows/agent-fix-point-redemption.yml

      - name: Run focused tests
        run: |
          node --test \
            PersonalBrandTestingEnvironment/tests/point-contract.test.js \
            PersonalBrandTestingEnvironment/tests/client-claim-flow.test.js \
            PersonalBrandTestingEnvironment/tests/client-gas.test.js

      - name: Commit and push focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            PersonalBrandTestingEnvironment/gas/client/Code.gs \
            PersonalBrandTestingEnvironment/tests/client-gas.test.js \
            .github/workflows/validate-personal-brand-points.yml \
            .github/workflows/agent-fix-point-redemption.yml
          git commit -m "fix: stabilize point redemption GAS flow"
          git push origin HEAD:${{ github.ref_name }}
