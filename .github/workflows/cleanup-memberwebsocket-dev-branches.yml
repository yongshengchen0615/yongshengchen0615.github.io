name: Cleanup MemberWebsocket-dev branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-memberwebsocket-dev-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Prepare rollback bundle for commits not in main
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          branches=(
          'cleanup/memberwebsocket-retired-functions-20260919'
          'cleanup/memberwebsocket-single-render-20260919'
          'codex/admin-booking-e2e-lifecycle-20260922'
          'codex/admin-membership-terms-ui-20260930'
          'codex/booking-cancellation-realtime-polling-20260926'
          'codex/qa-functional-optimization-20260930'
          'codex/selectable-e2e-20260926'
          'e2e/complete-feature-coverage-20260924'
          'e2e/qa-done-node-coverage-20261001'
          'e2e-evolution-20260923'
          'feat/admin-integration-center-20260925'
          'feat/benefit-ticket-center-20260925'
          'feat/booking-benefit-e2e-groups-20261002'
          'feat/booking-benefit-redemption-20261002'
          'feat/booking-technician-status-tabs-20260920'
          'feat/coupon-multiple-map-locations'
          'feat/event-coupon-inventory-location-20260928'
          'feat/event-ticket-checkbox-claim-20261002'
          'feat/full-human-paired-e2e'
          'feat/integration-center-e2e-20260925'
          'feat/member360-operations-calendar-20260925'
          'feat/member360-ui-polish-20260925'
          'feat/member-access-control-20260930'
          'feat/member-terms-consent'
          'feat/test-member-roster-20260920'
          'feat/ticket-editor-audience-20260925'
          'feat/ticket-editor-audience-v2-20260925'
          'feature/adversarial-e2e-20260924'
          'feature/all-ticket-gps-address-search'
          'feature/booking-day-before-reminder-20260929'
          'feature/test-mode-20260920'
          'feature/ticket-address-nearest-fallback'
          'feature/ticket-location-confirm-radius'
          'fix/admin-booking-e2e-actions-20260922'
          'fix/admin-booking-queue-e2e-20260922'
          'fix/admin-e2e-rate-limit-20260923'
          'fix/admin-fixed-ticket-refresh-20260919'
          'fix/admin-inline-e2e-screenshot-20260924'
          'fix/admin-member-records-dark-20260924'
          'fix/align-supabase-migration-history-20260922'
          'fix/booking-activities-display-only-20261002'
          'fix/booking-date-window-diagnostics-20260924'
          'fix/booking-e2e-holiday-slot-20260923'
          'fix/booking-e2e-live-admin-handoff-20260923'
          'fix/booking-full-e2e-realtime-risk-20260922'
          'fix/booking-live-e2e-window-race-20260923'
          'fix/booking-nav-badge-visual-20260925'
          'fix/booking-nav-live-badge-20260925'
          'fix/booking-rewards-asset-version-test'
          'fix/booking-shared-settings-e2e'
          'fix/booking-technician-disable-action-20260920'
          'fix/booking-technician-disable-fallback-20260920'
          'fix/csp-e2e-performance-20260929'
          'fix/e2e-background-startup-20260930'
          'fix/e2e-booking-data-realtime-20260923'
          'fix/e2e-booking-statepack-client-retry-20260923'
          'fix/e2e-client-background-runners-20260923'
          'fix/e2e-diagnostic-triage-20260924'
          'fix/e2e-event-lottery-and-data-integrity-20260923'
          'fix/e2e-event-lottery-coverage-20260923'
          'fix/e2e-hidden-state-20260929'
          'fix/e2e-one-window-per-test-account-20260923'
          'fix/e2e-runner-deadlines-20260929'
          'fix/e2e-snapshot-debug-20260929'
          'fix/e2e-snapshot-gaps-20260923'
          'fix/e2e-snapshot-regressions-20260924'
          'fix/e2e-tour-blocker-20260929'
          'fix/formal-member-join-clear-semantics-20260929'
          'fix/member360-layout-20260925'
          'fix/member-e2e-stability-20260922'
          'fix/member-grant-validation-e2e-20260922'
          'fix/member-profile-submit-hijack-20260929'
          'fix/member-terms-clear-20260929'
          'fix/member-terms-renew-view'
          'fix/member-tour-auto-start-20260927'
          'fix/member-tour-spotlight-mask-20260928'
          'fix/member-tour-ui-first-open-20260927'
          'fix/memberwebsocket-layout-stability-20261001'
          'fix/modal-dark-parity-20260925'
          'fix/paired-count-layout-20260923'
          'fix/sync-test-terms-migration-versions-20260928'
          'fix/test-account-membership-terms-consent-20260928'
          'fix/test-account-tour-parity-20260927'
          'fix/test-member-migration-version-20260920'
          'fix/ticket-map-rendering'
          'fix/user-e2e-stability-20260921-night'
          'human-e2e-all-clients-20260921'
          'improve/e2e-diagnostics-v2'
          'm3-ui-ux-20260929'
          'member-test-realistic-observer-20260921'
          'memberwebsocket-booking-modal-ux-20260925'
          'memberwebsocket-ci-coverage-20260925'
          'memberwebsocket-nightly-uiux-perf-20260929'
          'memberwebsocket-realtime-retention-20260925'
          'memberwebsocket-sync-edge-auth-20260925'
          'perf/admin-e2e-screenshot-preload-20260924'
          'qa/deep-admin-user-e2e-20260922'
          'qa/e2e-coverage-performance-20260929'
          'qa/reminder-line-retry-e2e-20260929'
          'refactor/memberwebsocket-unified-core-20260919'
          'refactor/unified-background-e2e-20260923'
          'refactor/unify-admin-paired-e2e-20260923'
          'ui/lumen-design-system-20260924'
          'ui/lumen-experience-20260924'
          'ui/test-center-workspace-layout-20260923'
          'ui-refresh-20260924'
          'user-qa-runner-20260921'
          )
          unique_refs=()
          for branch in "${branches[@]}"; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              continue
            fi
            if ! git merge-base --is-ancestor "$ref" refs/remotes/origin/main; then
              unique_refs+=("$ref")
            fi
          done

          if (( ${#unique_refs[@]} > 0 )); then
            git bundle create memberwebsocket-dev-branches-backup.bundle "${unique_refs[@]}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Backed up ${#unique_refs[@]} branch refs with commits not reachable from main."
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No unique commits require a rollback bundle."
          fi

      - name: Upload rollback bundle
        if: steps.backup.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memberwebsocket-dev-branches-backup
          path: memberwebsocket-dev-branches-backup.bundle
          retention-days: 90
          if-no-files-found: error

      - name: Delete MemberWebsocket-dev development branches
        shell: bash
        run: |
          set -u
          branches=(
          'cleanup/memberwebsocket-retired-functions-20260919'
          'cleanup/memberwebsocket-single-render-20260919'
          'codex/admin-booking-e2e-lifecycle-20260922'
          'codex/admin-membership-terms-ui-20260930'
          'codex/booking-cancellation-realtime-polling-20260926'
          'codex/qa-functional-optimization-20260930'
          'codex/selectable-e2e-20260926'
          'e2e/complete-feature-coverage-20260924'
          'e2e/qa-done-node-coverage-20261001'
          'e2e-evolution-20260923'
          'feat/admin-integration-center-20260925'
          'feat/benefit-ticket-center-20260925'
          'feat/booking-benefit-e2e-groups-20261002'
          'feat/booking-benefit-redemption-20261002'
          'feat/booking-technician-status-tabs-20260920'
          'feat/coupon-multiple-map-locations'
          'feat/event-coupon-inventory-location-20260928'
          'feat/event-ticket-checkbox-claim-20261002'
          'feat/full-human-paired-e2e'
          'feat/integration-center-e2e-20260925'
          'feat/member360-operations-calendar-20260925'
          'feat/member360-ui-polish-20260925'
          'feat/member-access-control-20260930'
          'feat/member-terms-consent'
          'feat/test-member-roster-20260920'
          'feat/ticket-editor-audience-20260925'
          'feat/ticket-editor-audience-v2-20260925'
          'feature/adversarial-e2e-20260924'
          'feature/all-ticket-gps-address-search'
          'feature/booking-day-before-reminder-20260929'
          'feature/test-mode-20260920'
          'feature/ticket-address-nearest-fallback'
          'feature/ticket-location-confirm-radius'
          'fix/admin-booking-e2e-actions-20260922'
          'fix/admin-booking-queue-e2e-20260922'
          'fix/admin-e2e-rate-limit-20260923'
          'fix/admin-fixed-ticket-refresh-20260919'
          'fix/admin-inline-e2e-screenshot-20260924'
          'fix/admin-member-records-dark-20260924'
          'fix/align-supabase-migration-history-20260922'
          'fix/booking-activities-display-only-20261002'
          'fix/booking-date-window-diagnostics-20260924'
          'fix/booking-e2e-holiday-slot-20260923'
          'fix/booking-e2e-live-admin-handoff-20260923'
          'fix/booking-full-e2e-realtime-risk-20260922'
          'fix/booking-live-e2e-window-race-20260923'
          'fix/booking-nav-badge-visual-20260925'
          'fix/booking-nav-live-badge-20260925'
          'fix/booking-rewards-asset-version-test'
          'fix/booking-shared-settings-e2e'
          'fix/booking-technician-disable-action-20260920'
          'fix/booking-technician-disable-fallback-20260920'
          'fix/csp-e2e-performance-20260929'
          'fix/e2e-background-startup-20260930'
          'fix/e2e-booking-data-realtime-20260923'
          'fix/e2e-booking-statepack-client-retry-20260923'
          'fix/e2e-client-background-runners-20260923'
          'fix/e2e-diagnostic-triage-20260924'
          'fix/e2e-event-lottery-and-data-integrity-20260923'
          'fix/e2e-event-lottery-coverage-20260923'
          'fix/e2e-hidden-state-20260929'
          'fix/e2e-one-window-per-test-account-20260923'
          'fix/e2e-runner-deadlines-20260929'
          'fix/e2e-snapshot-debug-20260929'
          'fix/e2e-snapshot-gaps-20260923'
          'fix/e2e-snapshot-regressions-20260924'
          'fix/e2e-tour-blocker-20260929'
          'fix/formal-member-join-clear-semantics-20260929'
          'fix/member360-layout-20260925'
          'fix/member-e2e-stability-20260922'
          'fix/member-grant-validation-e2e-20260922'
          'fix/member-profile-submit-hijack-20260929'
          'fix/member-terms-clear-20260929'
          'fix/member-terms-renew-view'
          'fix/member-tour-auto-start-20260927'
          'fix/member-tour-spotlight-mask-20260928'
          'fix/member-tour-ui-first-open-20260927'
          'fix/memberwebsocket-layout-stability-20261001'
          'fix/modal-dark-parity-20260925'
          'fix/paired-count-layout-20260923'
          'fix/sync-test-terms-migration-versions-20260928'
          'fix/test-account-membership-terms-consent-20260928'
          'fix/test-account-tour-parity-20260927'
          'fix/test-member-migration-version-20260920'
          'fix/ticket-map-rendering'
          'fix/user-e2e-stability-20260921-night'
          'human-e2e-all-clients-20260921'
          'improve/e2e-diagnostics-v2'
          'm3-ui-ux-20260929'
          'member-test-realistic-observer-20260921'
          'memberwebsocket-booking-modal-ux-20260925'
          'memberwebsocket-ci-coverage-20260925'
          'memberwebsocket-nightly-uiux-perf-20260929'
          'memberwebsocket-realtime-retention-20260925'
          'memberwebsocket-sync-edge-auth-20260925'
          'perf/admin-e2e-screenshot-preload-20260924'
          'qa/deep-admin-user-e2e-20260922'
          'qa/e2e-coverage-performance-20260929'
          'qa/reminder-line-retry-e2e-20260929'
          'refactor/memberwebsocket-unified-core-20260919'
          'refactor/unified-background-e2e-20260923'
          'refactor/unify-admin-paired-e2e-20260923'
          'ui/lumen-design-system-20260924'
          'ui/lumen-experience-20260924'
          'ui/test-center-workspace-layout-20260923'
          'ui-refresh-20260924'
          'user-qa-runner-20260921'
          )
          failures=()
          deleted=0
          missing=0

          for branch in "${branches[@]}"; do
            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "SKIP missing: $branch"
              missing=$((missing + 1))
              continue
            fi

            if git push origin --delete "$branch"; then
              echo "DELETED: $branch"
              deleted=$((deleted + 1))
            else
              echo "FAILED: $branch" >&2
              failures+=("$branch")
            fi
          done

          echo "Deleted: $deleted"
          echo "Already missing: $missing"
          if (( ${#failures[@]} > 0 )); then
            printf 'Failed branches:\n' >&2
            printf ' - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      - name: Verify preserved branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in main develop master; do
            git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null
            echo "PRESERVED: $branch"
          done
