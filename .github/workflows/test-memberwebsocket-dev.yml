name: Test MemberWebsocket Dev

on:
  push:
    paths:
      - 'MemberWebsocket-dev/**'
      - '.github/workflows/test-memberwebsocket-dev.yml'
  pull_request:
    paths:
      - 'MemberWebsocket-dev/**'
      - '.github/workflows/test-memberwebsocket-dev.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run application regression tests
        run: node --test MemberWebsocket-dev/tests/*.test.js
      - name: Install DOM integration test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: MemberWebsocket-dev/tests/integration
      - name: Check admin startup and observer responsiveness
        run: node --test MemberWebsocket-dev/tests/integration/admin_startup.cjs MemberWebsocket-dev/tests/integration/booking_startup.cjs MemberWebsocket-dev/tests/integration/booking_copy.cjs
      - name: Check browser JavaScript syntax
        run: |
          node --check MemberWebsocket-dev/test-mode-client.js
          node --check MemberWebsocket-dev/member-system.js
          node --check MemberWebsocket-dev/admin/admin-session.js
          node --check MemberWebsocket-dev/admin/test-mode.js
          node --check MemberWebsocket-dev/admin/app.js
          node --check MemberWebsocket-dev/admin/grant-automation.js
          node --check MemberWebsocket-dev/admin/fixed-ticket-admin-integration.js
          node --check MemberWebsocket-dev/admin/fixed-ticket-calendar-option.js
          node --check MemberWebsocket-dev/admin/fixed-ticket-admin.js
          node --check MemberWebsocket-dev/admin/pointcard-redemption-limit.js
          node --check MemberWebsocket-dev/admin/booking-panel.js
          node --check MemberWebsocket-dev/admin/booking-panel-core.js
          node --check MemberWebsocket-dev/admin/booking-resources.js
          node --check MemberWebsocket-dev/admin/booking-cancellation-sync.js
          node --check MemberWebsocket-dev/member/app.js
          node --check MemberWebsocket-dev/member/profile-extension.js
          node --check MemberWebsocket-dev/member/profile-birthday-edit.js
          node --check MemberWebsocket-dev/points/pointcard-ticket-overview.js
          node --check MemberWebsocket-dev/points/app.js
          node --check MemberWebsocket-dev/event/app.js
          node --check MemberWebsocket-dev/calendar/app.js
          node --check MemberWebsocket-dev/booking/common.js
          node --check MemberWebsocket-dev/booking/membership-progress.js
          node --check MemberWebsocket-dev/booking/member-ui.js
          node --check MemberWebsocket-dev/booking/group-booking.js
          node --check MemberWebsocket-dev/booking/contact-details.js
          node --check MemberWebsocket-dev/booking/app.js
          node --check MemberWebsocket-dev/booking/calendar-flow.js
      - name: Check Edge Functions
        run: |
          deno check MemberWebsocket-dev/supabase/functions/api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/test-mode-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/pointcard-extension-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/member-profile-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-contact-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/grant-automation/index.ts
          deno check MemberWebsocket-dev/supabase/functions/event-ticket-links/index.ts
          deno check MemberWebsocket-dev/supabase/functions/scheduled-grant-messages/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-admin-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-group-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-group-slots-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-calendar-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-cancellation-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/member-calendar-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/calendar-system-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/calendar-member-api/index.ts
          deno check MemberWebsocket-dev/supabase/functions/point-ticket-batch-api/index.ts
      - name: Check grant automation wiring
        run: |
          grep -q 'grant-automation.js' MemberWebsocket-dev/admin/index.html
          grep -q 'supabaseGrantAutomationUrl' MemberWebsocket-dev/config.json
          grep -q 'fixed-ticket-admin-integration.js?v=fixed-ticket-sync-20260916-1' MemberWebsocket-dev/admin/index.html
          grep -q 'fixed-ticket-calendar-option.js?v=fixed-ticket-calendar-20260917-4' MemberWebsocket-dev/admin/index.html
          grep -q 'fixed-ticket-admin.js?v=fixed-ticket-unified-session-20260919-1' MemberWebsocket-dev/admin/index.html
          grep -q 'pointcard-redemption-limit.js?v=pointcard-unified-session-20260919-1' MemberWebsocket-dev/admin/index.html
          ! grep -q 'event-ticket-activity-link.js' MemberWebsocket-dev/admin/index.html
          grep -q 'app.js?v=test-mode-20260920-1' MemberWebsocket-dev/event/index.html
          ! grep -q 'activity-link.js' MemberWebsocket-dev/event/index.html
          test ! -e MemberWebsocket-dev/admin/event-ticket-activity-link.js
          test ! -e MemberWebsocket-dev/event/activity-link.js
          grep -q 'activity_url' MemberWebsocket-dev/supabase/migrations/20260910175251_add_event_ticket_activity_url.sql
          node MemberWebsocket-dev/tests/event_ticket_activity_link.test.js
          grep -q 'grant_member_benefits_with_event_bonus' MemberWebsocket-dev/supabase/migrations/20260910_add_grant_notification_schedule_calendar_bonus.sql
          grep -q 'claim_due_grant_messages' MemberWebsocket-dev/supabase/migrations/20260910_add_grant_notification_schedule_calendar_bonus.sql
      - name: Check unified calendar backend wiring
        run: |
          grep -q 'member-system.js?v=test-mode-20260920-1' MemberWebsocket-dev/calendar/index.html
          ! grep -q 'tier-sync.js' MemberWebsocket-dev/calendar/index.html
          ! grep -q 'realtime-resync.js' MemberWebsocket-dev/calendar/index.html
          grep -q 'memberCalendarFunctionUrl' MemberWebsocket-dev/config.json
          grep -q 'allowedTierLabels' MemberWebsocket-dev/supabase/functions/member-calendar-api/index.ts
          grep -q 'tierEligible' MemberWebsocket-dev/supabase/functions/member-calendar-api/index.ts
          grep -q 'applyCalendarDisplayRules' MemberWebsocket-dev/supabase/functions/member-calendar-api/index.ts
      - name: Check booking wiring
        run: |
          grep -q './booking/' MemberWebsocket-dev/index.html
          grep -q './admin/#booking' MemberWebsocket-dev/index.html
          grep -q '"bookingLiffId": "2010787602-sgiB0ETj"' MemberWebsocket-dev/config.json
          grep -q 'config.bookingLiffId' MemberWebsocket-dev/booking/common.js
          grep -q "signIn(state.config, 'booking')" MemberWebsocket-dev/booking/app.js
          grep -q 'memberProfile' MemberWebsocket-dev/booking/app.js
          grep -q 'id="memberTier"' MemberWebsocket-dev/booking/index.html
          grep -q 'id="membershipProgress"' MemberWebsocket-dev/booking/index.html
          grep -q 'membership-progress.js' MemberWebsocket-dev/booking/index.html
          grep -q 'ensureSeparateTierTargets' MemberWebsocket-dev/booking/membership-progress.js
          grep -q '目前會員階級：' MemberWebsocket-dev/booking/membership-progress.js
          grep -q 'member-ui.js?v=test-mode-20260920-1' MemberWebsocket-dev/booking/index.html
          grep -q 'app.js?v=test-mode-20260920-1' MemberWebsocket-dev/booking/index.html
          grep -q 'group-booking.js?v=test-mode-20260920-1' MemberWebsocket-dev/booking/index.html
          grep -q 'common.js?v=test-mode-20260920-1' MemberWebsocket-dev/booking/index.html
          grep -q 'id="bookingNoticeModal"' MemberWebsocket-dev/booking/index.html
          grep -q 'confirmBookingNoticeButton' MemberWebsocket-dev/booking/index.html
          grep -q 'function showNotice(message, options = {})' MemberWebsocket-dev/booking/common.js
          grep -q 'BookingSystem.showNotice' MemberWebsocket-dev/booking/app.js
          grep -q 'system.showNotice' MemberWebsocket-dev/booking/group-booking.js
          ! grep -q 'member-booking-format.js' MemberWebsocket-dev/booking/index.html
          ! grep -q 'booking-confirm-details.js' MemberWebsocket-dev/booking/index.html
          ! grep -q 'booking-notice-dedupe.js' MemberWebsocket-dev/booking/index.html
          grep -q 'id="joinMemberButton"' MemberWebsocket-dev/booking/index.html
          grep -q 'Booking access' MemberWebsocket-dev/booking/index.html
          grep -q 'membershipRequired === true' MemberWebsocket-dev/booking/member-ui.js
          ! grep -q 'class="member-summary"' MemberWebsocket-dev/booking/index.html
          grep -q 'id="bookingConfirmModal"' MemberWebsocket-dev/booking/index.html
          grep -q 'servicePicker' MemberWebsocket-dev/booking/app.js
          grep -q 'quantity > 2' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'calendar-flow.js' MemberWebsocket-dev/booking/index.html
          grep -q 'id="calendarGrid"' MemberWebsocket-dev/booking/index.html
          grep -q 'id="appointmentPanel" class="booking-selection-modal' MemberWebsocket-dev/booking/index.html
          grep -q 'id="closeAppointmentButton"' MemberWebsocket-dev/booking/index.html
          grep -q 'advance-disabled' MemberWebsocket-dev/booking/calendar-flow.js
          grep -q 'booking:settings-updated' MemberWebsocket-dev/booking/app.js
          grep -q 'booking-calendar-api' MemberWebsocket-dev/booking/calendar-flow.js
          grep -q 'booking_date,start_time,end_time' MemberWebsocket-dev/supabase/functions/booking-calendar-api/index.ts
          grep -q 'min_advance_days' MemberWebsocket-dev/supabase/functions/booking-calendar-api/index.ts
          grep -q 'requireJoinedMember' MemberWebsocket-dev/supabase/functions/booking-calendar-api/index.ts
          grep -q 'url=../../admin/#booking' MemberWebsocket-dev/booking/admin/index.html
          test ! -e MemberWebsocket-dev/booking/admin/app.js
          test ! -e MemberWebsocket-dev/booking/admin/subtabs.js
          test ! -e MemberWebsocket-dev/booking/admin/cancellation-review.js
          grep -q 'booking-panel.js?v=booking-tab-navigation-20260920-1' MemberWebsocket-dev/admin/index.html
          ! grep -q 'loadBookingAdminPanelExtension' MemberWebsocket-dev/member-system.js
          grep -q 'booking-panel-core.js' MemberWebsocket-dev/admin/booking-panel.js
          grep -q 'booking-cancellation-sync.js' MemberWebsocket-dev/admin/booking-panel.js
          grep -q "tab.textContent = '預約'" MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'admin.booking.settings.save' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminStartTime"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminEndTime"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminAdvanceDays"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminNotice"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'bookingNotice' MemberWebsocket-dev/booking/common.js
          grep -q 'id="bookingNotice"' MemberWebsocket-dev/booking/index.html
          grep -q '預約共用設定' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminNewTypeButton"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminBatchAddButton"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminBatchEditButton"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'id="bookingAdminBatchDeleteButton"' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'admin.booking.type.create' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'admin.booking.type.update' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'admin.booking.type.delete' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'admin.booking.service.delete' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'admin.booking.services.batch' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'booking-admin-api' MemberWebsocket-dev/admin/booking-panel-core.js
          ! grep -q '項目類型（每行一個）' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'booking-cancellation-api' MemberWebsocket-dev/admin/booking-cancellation-sync.js
          grep -q 'admin.approve' MemberWebsocket-dev/admin/booking-cancellation-sync.js
          grep -q 'admin.reject' MemberWebsocket-dev/admin/booking-cancellation-sync.js
          grep -q 'totalAmount()' MemberWebsocket-dev/booking/app.js
          grep -q 'STORE_SERVICE_ID' MemberWebsocket-dev/booking/app.js
          grep -q 'duplicateTypeGroups' MemberWebsocket-dev/booking/app.js
          ! grep -q 'bookingAdminWeekday' MemberWebsocket-dev/admin/booking-panel-core.js
          ! grep -q 'bookingAdminDescription' MemberWebsocket-dev/admin/booking-panel-core.js
          ! grep -q '項目說明' MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q 'create_booking_bundle_request' MemberWebsocket-dev/supabase/migrations/20260910_booking_global_hours_multi_service_realtime.sql
          grep -q 'booking_settings' MemberWebsocket-dev/supabase/migrations/20260910_booking_global_hours_multi_service_realtime.sql
          grep -q 'booking_items' MemberWebsocket-dev/supabase/migrations/20260910_booking_global_hours_multi_service_realtime.sql
          grep -q 'bookings_no_active_overlap' MemberWebsocket-dev/supabase/migrations/20260910_booking_global_hours_multi_service_realtime.sql
          grep -q 'BOOKING_SLOT_TAKEN' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'priceAmount: Number(row.price_amount' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'unit_price_amount' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'booking_services_price_amount_check' MemberWebsocket-dev/supabase/migrations/20260910212500_booking_service_pricing.sql
          grep -q 'booking_items_unit_price_amount_check' MemberWebsocket-dev/supabase/migrations/20260910212500_booking_service_pricing.sql
          grep -q 'booking_services_service_type_check' MemberWebsocket-dev/supabase/migrations/20260910224000_booking_service_types_and_store_service.sql
          grep -q 'counts_toward_membership = false' MemberWebsocket-dev/supabase/migrations/20260910224000_booking_service_types_and_store_service.sql
          grep -q 'booking_service_types' MemberWebsocket-dev/supabase/migrations/20260910230000_booking_shared_service_types.sql
          grep -q 'add column if not exists deleted_at' MemberWebsocket-dev/supabase/migrations/20260910233000_booking_admin_crud_batch.sql
          grep -q 'apply_booking_service_batch' MemberWebsocket-dev/supabase/migrations/20260910233000_booking_admin_crud_batch.sql
          grep -q 'rename_booking_service_type' MemberWebsocket-dev/supabase/migrations/20260910233000_booking_admin_crud_batch.sql
          grep -q 'delete_booking_service_type' MemberWebsocket-dev/supabase/migrations/20260910233000_booking_admin_crud_batch.sql
          grep -q 'maintenance.clear_public_data' MemberWebsocket-dev/supabase/migrations/20260910233000_booking_admin_crud_batch.sql
          grep -q 'bookingAdminApi' /dev/null || true
      - name: Check realtime sync wiring
        run: |
          grep -q "table: 'realtime_events'" MemberWebsocket-dev/member-system.js
          grep -q "scope === 'all' || scope === clientType" MemberWebsocket-dev/member-system.js
          for file in \
            MemberWebsocket-dev/member/index.html \
            MemberWebsocket-dev/points/index.html \
            MemberWebsocket-dev/event/index.html \
            MemberWebsocket-dev/calendar/index.html \
            MemberWebsocket-dev/admin/index.html; do
            grep -q '../member-system.js?v=test-mode-20260920-1' "$file"
            ! grep -q 'realtime-resync.js' "$file"
            ! grep -q './common.js' "$file"
          done
          grep -q "table: 'realtime_events'" MemberWebsocket-dev/booking/common.js
          grep -q "scope === 'all' || scope === targetScope" MemberWebsocket-dev/booking/common.js
          grep -q "addEventListener('visibilitychange'" MemberWebsocket-dev/booking/common.js
          grep -q "addEventListener('pageshow'" MemberWebsocket-dev/booking/common.js
          grep -q "addEventListener('online'" MemberWebsocket-dev/booking/common.js
          grep -q "status !== 'SUBSCRIBED'" MemberWebsocket-dev/booking/common.js
          grep -q "table: 'realtime_events'" MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q "type.startsWith('booking.')" MemberWebsocket-dev/admin/booking-panel-core.js
          grep -q "table: 'realtime_events'" MemberWebsocket-dev/admin/booking-cancellation-sync.js
          grep -q "type.startsWith('booking.cancellation.')" MemberWebsocket-dev/admin/booking-cancellation-sync.js
          grep -q 'notify_booking_cancellation_realtime_change' MemberWebsocket-dev/supabase/migrations/20260911123000_booking_cancellation_realtime_sync.sql
          grep -q 'notify_booking_realtime_change' MemberWebsocket-dev/supabase/migrations/20260910_booking_global_hours_multi_service_realtime.sql
          grep -q 'realtime_booking_service_types_change' MemberWebsocket-dev/supabase/migrations/20260910233100_booking_service_type_realtime.sql
          grep -q 'notify_surface_realtime_change' MemberWebsocket-dev/supabase/migrations/20260919062515_complete_realtime_invalidation_coverage.sql
          grep -q 'realtime_member_profile_change' MemberWebsocket-dev/supabase/migrations/20260919062515_complete_realtime_invalidation_coverage.sql
          grep -q 'visibilitychange' MemberWebsocket-dev/member-system.js
          grep -q "addEventListener('online'" MemberWebsocket-dev/member-system.js
          grep -q 'notify_admin_config_realtime_change' MemberWebsocket-dev/supabase/migrations/20260910_transactional_realtime_invalidation.sql
          grep -q 'notify_admin_grant_realtime_change' MemberWebsocket-dev/supabase/migrations/20260910_transactional_realtime_invalidation.sql
