name: Test MemberWebsocket Dev

on:
  push:
    paths:
      - 'MemberWebsocket-dev/**'
      - '.github/workflows/test-memberwebsocket-dev.yml'
  pull_request:
    paths:
      - 'MemberWebsocket-dev/**'
      - '.github/workflows/test-memberwebsocket-dev.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript syntax
        run: |
          node --check MemberWebsocket-dev/realtime-resync.js
          node --check MemberWebsocket-dev/admin/common.js
          node --check MemberWebsocket-dev/admin/app.js
          node --check MemberWebsocket-dev/admin/grant-automation.js
          node --check MemberWebsocket-dev/member/common.js
          node --check MemberWebsocket-dev/member/app.js
          node --check MemberWebsocket-dev/points/common.js
          node --check MemberWebsocket-dev/points/app.js
          node --check MemberWebsocket-dev/event/common.js
          node --check MemberWebsocket-dev/event/app.js
          node --check MemberWebsocket-dev/calendar/common.js
          node --check MemberWebsocket-dev/calendar/tier-sync.js
          node --check MemberWebsocket-dev/calendar/app.js
          node --check MemberWebsocket-dev/booking/common.js
          node --check MemberWebsocket-dev/booking/app.js
          node --check MemberWebsocket-dev/booking/calendar-flow.js
          node --check MemberWebsocket-dev/booking/admin/app.js
      - name: Check Edge Functions
        run: |
          deno check MemberWebsocket-dev/supabase/functions/grant-automation/index.ts
          deno check MemberWebsocket-dev/supabase/functions/scheduled-grant-messages/index.ts
          deno check MemberWebsocket-dev/supabase/functions/booking-api/index.ts
      - name: Check grant automation wiring
        run: |
          grep -q 'grant-automation.js' MemberWebsocket-dev/admin/index.html
          grep -q 'supabaseGrantAutomationUrl' MemberWebsocket-dev/config.json
          grep -q 'grant_member_benefits_with_event_bonus' MemberWebsocket-dev/supabase/migrations/20260910_add_grant_notification_schedule_calendar_bonus.sql
          grep -q 'claim_due_grant_messages' MemberWebsocket-dev/supabase/migrations/20260910_add_grant_notification_schedule_calendar_bonus.sql
      - name: Check calendar tier sync wiring
        run: |
          grep -q 'tier-sync.js' MemberWebsocket-dev/calendar/index.html
          grep -q 'allowedTierLabels' MemberWebsocket-dev/calendar/tier-sync.js
          grep -q 'tierEligible' MemberWebsocket-dev/calendar/tier-sync.js
      - name: Check booking wiring
        run: |
          grep -q './booking/' MemberWebsocket-dev/index.html
          grep -q './booking/admin/' MemberWebsocket-dev/index.html
          grep -q 'calendar-flow.js' MemberWebsocket-dev/booking/index.html
          grep -q 'calendarGrid' MemberWebsocket-dev/booking/calendar-flow.js
          grep -q "user.booking.calendar" MemberWebsocket-dev/booking/calendar-flow.js
          grep -q 'user.booking.create' MemberWebsocket-dev/booking/app.js
          grep -q 'bookingSubtabs' MemberWebsocket-dev/booking/admin/index.html
          grep -q 'data-admin-tab="services"' MemberWebsocket-dev/booking/admin/index.html
          grep -q 'data-admin-tab="confirmation"' MemberWebsocket-dev/booking/admin/index.html
          grep -q 'admin.booking.status.update' MemberWebsocket-dev/booking/admin/app.js
          grep -q 'bookings_active_slot_unique' MemberWebsocket-dev/supabase/migrations/20260910_add_booking_system.sql
          grep -q 'create_booking_request' MemberWebsocket-dev/supabase/migrations/20260910_add_booking_system.sql
          grep -q 'BOOKING_SLOT_TAKEN' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'eq("booking_date", date)' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'action === "user.booking.calendar"' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'select("booking_date,start_time")' MemberWebsocket-dev/supabase/functions/booking-api/index.ts
          grep -q 'on public.bookings(booking_date, start_time)' MemberWebsocket-dev/supabase/migrations/20260910_global_booking_slot_occupancy.sql
          grep -q 'BOOKING_GLOBAL_SLOT_MIGRATION_CONFLICT' MemberWebsocket-dev/supabase/migrations/20260910_global_booking_slot_occupancy.sql
      - name: Check realtime sync wiring
        run: |
          for file in \
            MemberWebsocket-dev/member/common.js \
            MemberWebsocket-dev/points/common.js \
            MemberWebsocket-dev/event/common.js \
            MemberWebsocket-dev/calendar/common.js; do
            grep -q "table: 'realtime_events'" "$file"
            grep -q "scope === 'all' || scope === clientType" "$file"
          done
          for file in \
            MemberWebsocket-dev/member/index.html \
            MemberWebsocket-dev/points/index.html \
            MemberWebsocket-dev/event/index.html \
            MemberWebsocket-dev/calendar/index.html; do
            grep -q '../realtime-resync.js' "$file"
          done
          grep -q 'visibilitychange' MemberWebsocket-dev/realtime-resync.js
          grep -q "addEventListener('online'" MemberWebsocket-dev/realtime-resync.js
          grep -q 'notify_admin_config_realtime_change' MemberWebsocket-dev/supabase/migrations/20260910_transactional_realtime_invalidation.sql
          grep -q 'notify_admin_grant_realtime_change' MemberWebsocket-dev/supabase/migrations/20260910_transactional_realtime_invalidation.sql
