name: Test PointsCard

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'optimize/**'
    paths:
      - 'MembershipSystem/PointsCard/**'
      - '.github/workflows/test-points-card.yml'
  pull_request:
    paths:
      - 'MembershipSystem/PointsCard/**'
      - '.github/workflows/test-points-card.yml'
      - '.github/workflows/deploy-membership-points-card-gas.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check MembershipSystem/PointsCard/redirect.js
          node --check MembershipSystem/PointsCard/shared/common.js
          node --check MembershipSystem/PointsCard/shared/perf-ux.js
          node --check MembershipSystem/PointsCard/user/app.js
          node --check MembershipSystem/PointsCard/user/card-gallery.js
          node --check MembershipSystem/PointsCard/user/point-notifications.js
          node --check MembershipSystem/PointsCard/admin/app.js
          node --check MembershipSystem/PointsCard/admin/card-lifecycle.js
          node --check MembershipSystem/PointsCard/admin/point-grant.js
          node --check MembershipSystem/PointsCard/vendor/qrcode-generator-2.0.4.js
          for file in MembershipSystem/PointsCard/gas/*.gs; do
            tmp="$RUNNER_TEMP/$(basename "$file").js"
            cp "$file" "$tmp"
            node --check "$tmp"
          done

      - name: Run PointsCard tests
        run: node --test MembershipSystem/PointsCard/tests/*.test.js
