<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>管理中心｜MemberHub</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../shared/hub.js" defer></script>
</head>
<body data-surface="admin">
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span><strong>MemberHub</strong><span>管理工作台</span></span></div>
      <a class="surface-switch" href="../user/">會員中心</a>
    </header>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Operations workspace</p>
      <h1 id="page-title">管理中心</h1>
      <p>從單一工作台進入會員、集點與日曆管理；實際權限仍由每個 GAS API 在伺服器端判斷。</p>
    </section>
    <section aria-labelledby="services-title">
      <div class="section-heading"><h2 id="services-title">管理模組</h2><span>權限分離驗證</span></div>
      <div class="module-list" data-module-list aria-live="polite"></div>
    </section>
    <p class="notice">看到入口不代表具有權限。會員等級、集點管理權與日曆管理權彼此獨立，未授權請求會由對應 GAS 拒絕。</p>
  </main>
</body>
</html>
