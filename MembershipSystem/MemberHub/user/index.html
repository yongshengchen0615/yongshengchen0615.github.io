<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>會員中心｜MemberHub</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../shared/hub.js" defer></script>
</head>
<body data-surface="user">
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span><strong>MemberHub</strong><span>整合會員服務</span></span></div>
      <a class="surface-switch" href="../admin/">管理中心</a>
    </header>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Your membership, together</p>
      <h1 id="page-title">會員中心</h1>
      <p>會員卡、集點票券與活動日曆，集中在同一個清楚、安全的入口。</p>
    </section>
    <section aria-labelledby="services-title">
      <div class="section-heading"><h2 id="services-title">會員服務</h2><span>3 個功能模組</span></div>
      <div class="module-list" data-module-list aria-live="polite"></div>
    </section>
    <p class="notice">每個模組只在開啟後進行 LINE 登入與伺服器驗證；本入口不保存 ID Token 或管理權限。</p>
  </main>
</body>
</html>
