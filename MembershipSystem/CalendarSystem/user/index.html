<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>日曆｜用戶端</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <section id="loadingView" class="state-card">
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在驗證 LINE 登入</h1>
      <p>完成身分驗證後才會載入日曆資料。</p>
    </section>

    <section id="errorView" class="state-card hidden" role="alert">
      <div class="state-icon">!</div>
      <h1 id="errorTitle">無法載入</h1>
      <p id="errorMessage"></p>
      <button id="retryButton" class="button primary" type="button">重新整理</button>
    </section>

    <main id="calendarView" class="hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">CalendarSystem</p>
          <h1>日曆</h1>
        </div>
        <div class="profile">
          <div class="profile-copy">
            <span id="displayName">LINE 使用者</span>
            <button id="logoutButton" class="link-button" type="button">登出</button>
          </div>
        </div>
      </header>

      <section class="calendar-card" aria-label="月曆">
        <div class="calendar-toolbar">
          <button id="prevMonth" class="icon-button" type="button" aria-label="上個月">‹</button>
          <div class="month-heading">
            <strong id="monthTitle"></strong>
            <button id="todayButton" class="link-button" type="button">今天</button>
          </div>
          <button id="nextMonth" class="icon-button" type="button" aria-label="下個月">›</button>
        </div>

        <div class="weekday-row" aria-hidden="true">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>
    </main>
  </div>

  <div id="selectedDayModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="selectedDateTitle">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Selected day</p>
          <h2 id="selectedDateTitle">今日行程</h2>
        </div>
        <div class="modal-header-actions">
          <span id="selectedCount" class="badge">0</span>
          <button id="closeSelectedDayButton" class="icon-button compact" type="button" aria-label="關閉當日行程">×</button>
        </div>
      </div>
      <div id="agendaList" class="agenda-list"></div>
    </div>
  </div>
</body>
</html>
