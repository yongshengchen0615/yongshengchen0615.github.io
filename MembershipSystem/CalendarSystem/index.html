<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>CalendarSystem</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #1d2433; }
    main { width: min(92vw, 520px); background: #fff; border: 1px solid #e5e9f0; border-radius: 20px; padding: 32px; box-shadow: 0 18px 48px rgba(20, 31, 52, .08); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #657083; line-height: 1.7; }
    .links { display: grid; gap: 12px; }
    a { display: block; padding: 14px 16px; border-radius: 12px; text-decoration: none; font-weight: 700; text-align: center; }
    a.primary { background: #06c755; color: #fff; }
    a.secondary { background: #eef2f7; color: #243047; }
  </style>
</head>
<body>
  <main>
    <h1>日曆系統</h1>
    <p>用戶端與管理端採用不同 LIFF 入口。實際資料存取與管理權限由 GAS 後端驗證。</p>
    <div class="links">
      <a class="primary" href="./user/">進入用戶端</a>
      <a class="secondary" href="./admin/">進入管理端</a>
    </div>
  </main>
</body>
</html>
