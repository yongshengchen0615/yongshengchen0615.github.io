<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>日曆｜管理端</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <section id="loadingView" class="state-card">
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在驗證管理員身分</h1>
      <p>管理端會同時驗證 LINE 身分與 GAS 端 Admins 權限。</p>
    </section>

    <section id="errorView" class="state-card hidden" role="alert">
      <div class="state-icon">!</div>
      <h1 id="errorTitle">無法進入管理端</h1>
      <p id="errorMessage"></p>
      <div id="pendingBox" class="pending-box hidden">
        <strong>待授權 LINE User ID</strong>
        <code id="pendingUserId"></code>
        <p>請到 GAS 建立的 Spreadsheet → <b>Admins</b>，把此列的 <b>role</b> 改為 <b>admin</b>，<b>status</b> 改為 <b>active</b>，再重新整理。</p>
      </div>
      <button id="retryButton" class="button primary" type="button">重新整理</button>
    </section>

    <main id="adminView" class="hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">CalendarSystem Admin</p>
          <h1>日曆管理</h1>
        </div>
        <div class="profile-copy">
          <span id="displayName">管理員</span>
          <button id="logoutButton" class="link-button" type="button">登出</button>
        </div>
      </header>

      <section class="panel editor-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Editor</p>
            <h2 id="formTitle">新增日曆項目</h2>
          </div>
          <button id="cancelEditButton" class="button ghost hidden" type="button">取消編輯</button>
        </div>

        <form id="itemForm" novalidate>
          <input id="itemId" type="hidden">
          <input id="expectedUpdatedAt" type="hidden">

          <div class="form-grid">
            <label>
              <span>類型</span>
              <select id="type" required>
                <option value="holiday">休假日</option>
                <option value="event">活動</option>
                <option value="notice">公告</option>
              </select>
            </label>

            <label>
              <span>狀態</span>
              <select id="status" required>
                <option value="published">已發布</option>
                <option value="draft">草稿</option>
              </select>
            </label>

            <label class="span-2">
              <span>標題</span>
              <input id="title" type="text" maxlength="80" autocomplete="off" required placeholder="例如：中秋節休假">
            </label>

            <label>
              <span>開始日期</span>
              <input id="startDate" type="date" required>
            </label>

            <label>
              <span>結束日期</span>
              <input id="endDate" type="date" required>
            </label>

            <label class="check-label span-2">
              <input id="allDay" type="checkbox" checked>
              <span>全天</span>
            </label>

            <label id="startTimeLabel" class="hidden">
              <span>開始時間</span>
              <input id="startTime" type="time">
            </label>

            <label id="endTimeLabel" class="hidden">
              <span>結束時間</span>
              <input id="endTime" type="time">
            </label>

            <label class="span-2">
              <span>地點</span>
              <input id="location" type="text" maxlength="120" autocomplete="off" placeholder="選填">
            </label>

            <label class="span-2">
              <span>說明</span>
              <textarea id="description" rows="4" maxlength="1000" placeholder="選填"></textarea>
            </label>
          </div>

          <div id="formMessage" class="form-message hidden" role="alert"></div>
          <div class="form-actions">
            <button id="saveButton" class="button primary" type="submit">新增</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="panel-heading list-heading">
          <div>
            <p class="eyebrow">Calendar items</p>
            <h2>日曆項目</h2>
          </div>
          <div class="filters">
            <select id="filterStatus" aria-label="依狀態篩選">
              <option value="all">全部狀態</option>
              <option value="published">已發布</option>
              <option value="draft">草稿</option>
              <option value="archived">已封存</option>
            </select>
            <button id="refreshButton" class="button ghost" type="button">重新載入</button>
          </div>
        </div>
        <div id="itemsList" class="items-list"></div>
      </section>
    </main>
  </div>
</body>
</html>
