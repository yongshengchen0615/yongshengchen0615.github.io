<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="referrer" content="no-referrer">
  <title>集點卡｜Membership System</title>
  <style>
    :root{color-scheme:light;font-family:Inter,"Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f1e8;color:#18212b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,760px);display:grid;gap:18px}.hero{padding:38px;border:1px solid #ded7c9;border-radius:28px;background:#fffdf8;box-shadow:0 22px 70px rgba(51,41,27,.12)}
    .eyebrow{font-size:12px;font-weight:900;letter-spacing:.15em;color:#9b6c28}.hero h1{margin:8px 0 12px;font-size:clamp(34px,8vw,64px);letter-spacing:-.055em}.hero p{max-width:580px;margin:0;color:#67717c;line-height:1.7}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.button{display:grid;place-items:center;min-height:54px;border-radius:16px;text-decoration:none;font-weight:900}
    .primary{background:#18212b;color:#fff}.secondary{border:1px solid #d7d0c2;background:#fff;color:#18212b}.note{font-size:12px;color:#7d8791;line-height:1.6}
    @media(max-width:560px){.hero{padding:28px 22px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <span class="eyebrow">POINT CARD</span>
      <h1>會員集點卡</h1>
      <p>以 LINE 身分登入的獨立集點卡系統。用戶查看點數、開啟集點連結與查詢紀錄；管理端負責點數調整、兌獎、發放一次性集點碼與規則設定。</p>
      <div class="actions">
        <a class="button primary" href="./user/">開啟用戶端</a>
        <a class="button secondary" href="./admin/">開啟管理端</a>
      </div>
    </section>
    <p class="note">首次部署前請先完成 shared/config.json、Apps Script Script Properties、LIFF Endpoint 與 GitHub Actions Secrets 設定。</p>
  </main>
</body>
</html>
