<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="referrer" content="no-referrer">
  <title>集點卡管理端</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section id="boot" class="panel state-panel">
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在載入集點管理端</h1>
      <p>正在驗證 LINE 身分與管理權限。</p>
    </section>

    <section id="errorState" class="panel state-panel hidden" role="alert">
      <span class="eyebrow danger">ACCESS ERROR</span>
      <h1>管理端無法使用</h1>
      <p id="errorMessage">請稍後再試。</p>
      <button id="retryButton" class="button primary" type="button">重新整理</button>
    </section>

    <section id="app" class="hidden">
      <header class="topbar">
        <div><span class="eyebrow">POINT CARD ADMIN</span><h1>集點卡管理</h1></div>
        <button id="refreshButton" class="icon-button" type="button" aria-label="重新整理">↻</button>
      </header>

      <section class="metrics">
        <article><span>會員數</span><strong id="metricMembers">0</strong></article>
        <article><span>有效會員</span><strong id="metricActive">0</strong></article>
        <article><span>流通點數</span><strong id="metricBalance">0</strong></article>
        <article><span>累計發點</span><strong id="metricEarned">0</strong></article>
      </section>

      <section class="panel settings-panel">
        <div class="section-heading">
          <div><span class="eyebrow">RULES</span><h2>集點規則</h2></div>
          <button id="saveSettingsButton" class="button primary" type="button">儲存設定</button>
        </div>
        <div class="settings-grid">
          <label>兌獎門檻（點）<input id="targetPointsInput" type="number" min="1" max="1000" step="1"></label>
          <label>獎勵名稱<input id="rewardTitleInput" type="text" maxlength="80"></label>
        </div>
        <p id="settingsMessage" class="form-message hidden"></p>
      </section>

      <section class="panel voucher-panel">
        <div class="section-heading">
          <div><span class="eyebrow">ISSUE POINTS</span><h2>發放一次性集點碼</h2></div>
        </div>
        <form id="voucherForm" class="voucher-form">
          <label>點數<input id="voucherPoints" type="number" min="1" max="1000" value="1" required></label>
          <label>到期時間<input id="voucherExpiresAt" type="datetime-local" required></label>
          <label class="wide">備註<input id="voucherNote" type="text" maxlength="200" placeholder="例如：消費滿額贈點"></label>
          <button id="createVoucherButton" class="button primary" type="submit">建立集點碼</button>
        </form>
        <div id="shareBox" class="share-box hidden">
          <span>此集點碼只會在建立後顯示一次</span>
          <strong id="sharePoints"></strong>
          <div class="share-actions">
            <input id="shareUrl" type="text" readonly>
            <button id="copyShareButton" class="button secondary" type="button">複製連結</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div><span class="eyebrow">MEMBERS</span><h2>會員點數</h2></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>會員</th><th>點數</th><th>累計發點</th><th>狀態</th><th>操作</th></tr></thead>
            <tbody id="memberRows"></tbody>
          </table>
        </div>
        <p id="memberEmpty" class="empty hidden">目前沒有集點會員。</p>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div><span class="eyebrow">VOUCHERS</span><h2>最近集點碼</h2></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>編號</th><th>點數</th><th>狀態</th><th>到期</th><th>操作</th></tr></thead>
            <tbody id="voucherRows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div><span class="eyebrow">LEDGER</span><h2>最近交易</h2></div>
        </div>
        <div id="transactionList" class="transaction-list"></div>
      </section>
    </section>
  </main>

  <dialog id="adjustDialog" class="dialog">
    <form id="adjustForm" class="dialog-card">
      <span class="eyebrow">ADJUST POINTS</span>
      <h2>調整會員點數</h2>
      <p id="adjustMemberLabel"></p>
      <label>點數異動（可輸入負數）<input id="adjustDelta" type="number" min="-1000" max="1000" step="1" required></label>
      <label>原因<input id="adjustNote" type="text" maxlength="200" required></label>
      <p id="adjustError" class="form-message error hidden"></p>
      <div class="dialog-actions"><button id="cancelAdjustButton" class="button secondary" type="button">取消</button><button class="button primary" type="submit">確認調整</button></div>
    </form>
  </dialog>

  <dialog id="rewardDialog" class="dialog">
    <form id="rewardForm" class="dialog-card">
      <span class="eyebrow">REDEEM REWARD</span>
      <h2>兌換滿點獎勵</h2>
      <p id="rewardMemberLabel"></p>
      <div class="reward-cost"><span id="rewardDialogTitle">集滿送好禮</span><strong><b id="rewardCost">10</b> 點</strong></div>
      <label>備註<input id="rewardNote" type="text" maxlength="200" placeholder="例如：現場已交付贈品"></label>
      <p id="rewardError" class="form-message error hidden"></p>
      <div class="dialog-actions"><button id="cancelRewardButton" class="button secondary" type="button">取消</button><button class="button primary" type="submit">確認兌換</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../shared/common.js"></script>
  <script src="./app.js"></script>
</body>
</html>
