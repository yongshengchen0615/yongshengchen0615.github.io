<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="referrer" content="no-referrer">
  <title>我的集點卡</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section id="boot" class="panel state-panel">
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在載入集點卡</h1>
      <p>正在確認 LINE 登入與點數資料。</p>
    </section>

    <section id="errorState" class="panel state-panel hidden" role="alert">
      <span class="eyebrow danger">無法載入</span>
      <h1>集點卡暫時無法使用</h1>
      <p id="errorMessage">請稍後再試。</p>
      <button id="retryButton" class="button button-primary" type="button">重新整理</button>
    </section>

    <section id="app" class="hidden">
      <header class="topbar">
        <div><span class="eyebrow">POINT CARD</span><h1>我的集點卡</h1></div>
        <button id="refreshButton" class="icon-button" type="button" aria-label="重新整理">↻</button>
      </header>

      <article class="point-card">
        <div class="card-orb orb-a"></div><div class="card-orb orb-b"></div>
        <div class="card-top">
          <div class="brand-mark">P</div>
          <div><span>MEMBER</span><strong id="displayName">LINE 會員</strong></div>
          <span id="statusBadge" class="status-badge">有效</span>
        </div>

        <div class="balance-block">
          <span>目前點數</span>
          <strong id="pointsBalance">0</strong>
          <small>POINTS</small>
        </div>

        <div class="member-row">
          <div><span>集點會員編號</span><strong id="pointMemberNo">—</strong></div>
          <div><span>獎勵門檻</span><strong><b id="targetPoints">10</b> 點</strong></div>
        </div>

        <div class="stamp-header">
          <div><span>本張進度</span><strong id="progressLabel">0 / 10</strong></div>
          <span id="rewardReadyBadge" class="reward-ready hidden">可兌換</span>
        </div>
        <div id="stampGrid" class="stamp-grid" aria-label="集點進度"></div>

        <div class="reward-box">
          <span>滿點獎勵</span>
          <strong id="rewardTitle">集滿送好禮</strong>
          <p id="rewardSummary">再集 10 點即可兌換。</p>
        </div>

        <button id="scanButton" class="button card-button" type="button">掃描集點 QR Code</button>
      </article>

      <section class="panel history-panel">
        <div class="section-heading">
          <div><span class="eyebrow">HISTORY</span><h2>最近點數紀錄</h2></div>
        </div>
        <div id="historyList" class="history-list"></div>
        <p id="historyEmpty" class="empty hidden">目前還沒有點數紀錄。</p>
      </section>

      <footer class="footer">點數與兌獎結果皆由 GAS server-side 驗證與記錄。</footer>
    </section>
  </main>

  <div id="loadingOverlay" class="overlay hidden" role="status" aria-live="polite" aria-busy="true">
    <div class="modal-card">
      <div class="spinner" aria-hidden="true"></div>
      <h2>正在加入點數</h2>
      <p>正在驗證集點碼與會員狀態，請勿重複操作。</p>
    </div>
  </div>

  <div id="messageOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="messageTitle">
    <div class="modal-card">
      <div id="messageIcon" class="message-icon">✓</div>
      <span id="messageEyebrow" class="eyebrow">POINT CARD</span>
      <h2 id="messageTitle">點數已加入</h2>
      <p id="messageBody"></p>
      <button id="messageConfirmButton" class="button button-primary" type="button">確認</button>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../shared/common.js"></script>
  <script src="./app.js"></script>
</body>
</html>
