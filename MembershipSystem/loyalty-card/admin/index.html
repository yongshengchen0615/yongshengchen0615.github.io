<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>集點卡管理端</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>集點卡管理端</h1>
      </div>
      <a class="text-link" href="../user/">用戶端</a>
    </header>

    <section id="configNotice" class="notice notice-warn hidden" role="status"></section>
    <section id="statusNotice" class="notice hidden" aria-live="polite"></section>
    <section id="loadingState" class="loading-card card hidden" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>正在處理管理操作…</span>
    </section>

    <section id="loggedOut" class="hero card">
      <div>
        <p class="eyebrow">ADMIN LIFF</p>
        <h2>使用 LINE 登入管理端</h2>
        <p class="muted">LIFF 只負責 Authentication；Admin Role 與 Account Status 由 GAS 每次 request 重新驗證。</p>
      </div>
      <button id="loginBtn" class="btn btn-line" type="button">使用 LINE 登入</button>
    </section>

    <section id="adminArea" class="hidden admin-layout">
      <aside class="card admin-sidebar">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">ADMIN</p>
            <h2 id="adminName">管理員</h2>
          </div>
          <button id="logoutBtn" class="btn btn-ghost" type="button">登出</button>
        </div>

        <label class="field">
          <span>搜尋會員</span>
          <input id="searchInput" type="search" maxlength="80" placeholder="會員名稱、會員 ID 或卡號" autocomplete="off">
        </label>
        <button id="searchBtn" class="btn btn-primary full" type="button">搜尋</button>
        <div id="searchResults" class="search-results">
          <p class="muted">輸入條件後搜尋會員。</p>
        </div>
      </aside>

      <section class="card admin-main">
        <div id="emptySelection" class="empty-state">
          <div>
            <h2>選擇會員</h2>
            <p class="muted">先搜尋會員，再查看餘額、交易與進行點數異動。</p>
          </div>
        </div>

        <div id="memberEditor" class="hidden">
          <div class="section-heading">
            <div>
              <p class="eyebrow">MEMBER</p>
              <h2 id="selectedName"></h2>
              <p id="selectedIdentity" class="mono muted"></p>
            </div>
            <div class="balance-badge"><span id="selectedBalance">0</span> 點</div>
          </div>

          <div class="form-grid">
            <label class="field">
              <span>點數</span>
              <input id="amountInput" type="number" min="1" step="1" value="1" inputmode="numeric">
            </label>
            <label class="field field-wide">
              <span>操作原因</span>
              <input id="reasonInput" type="text" maxlength="120" placeholder="例如：消費集點、人工更正、兌換獎勵" autocomplete="off">
            </label>
          </div>

          <div class="action-grid">
            <button id="earnBtn" class="btn btn-primary mutation-btn" type="button">快速集點</button>
            <button id="increaseBtn" class="btn btn-primary mutation-btn" type="button">增加點數</button>
            <button id="decreaseBtn" class="btn btn-danger mutation-btn" type="button">扣除點數</button>
            <button id="redeemBtn" class="btn btn-accent mutation-btn" type="button">兌換門檻</button>
          </div>

          <p id="mutationHint" class="small muted"></p>

          <div class="section-heading history-heading">
            <div>
              <p class="eyebrow">TRANSACTIONS</p>
              <h2>交易紀錄</h2>
            </div>
            <button id="refreshMemberBtn" class="btn btn-ghost" type="button">重新整理</button>
          </div>
          <div id="selectedHistory" class="history-list">
            <p class="muted">目前沒有交易紀錄。</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
