<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net; style-src 'self'; img-src 'self' data: https://profile.line-scdn.net https://*.line-scdn.net; connect-src 'self' https://*.workers.dev https://*.line.me https://*.line-scdn.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests">
  <title>會員集點卡</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOYALTY CARD</p>
        <h1>會員集點卡</h1>
      </div>
      <a class="text-link" href="../admin/">管理端</a>
    </header>

    <section id="configNotice" class="notice notice-warn hidden"></section>
    <section id="statusNotice" class="notice hidden" aria-live="polite"></section>

    <section id="loggedOut" class="hero card">
      <div>
        <p class="eyebrow">LIFF LOGIN</p>
        <h2>登入後查看你的集點進度</h2>
        <p class="muted">使用 LINE LIFF 驗證身分；會員資料由後端驗證後建立或更新。</p>
      </div>
      <button id="loginBtn" class="btn btn-line" type="button">使用 LINE 登入</button>
    </section>

    <section id="memberArea" class="hidden">
      <article class="profile card">
        <img id="memberAvatar" class="avatar" alt="會員頭像">
        <div>
          <p class="eyebrow">MEMBER</p>
          <h2 id="memberName">會員</h2>
          <p id="cardCode" class="mono muted"></p>
        </div>
        <button id="logoutBtn" class="btn btn-ghost" type="button">登出工作階段</button>
      </article>

      <article class="card stamp-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOUR STAMPS</p>
            <h2><span id="balance">0</span> 點</h2>
          </div>
          <p id="rewardHint" class="muted"></p>
        </div>
        <div id="stampGrid" class="stamp-grid" aria-label="集點進度"></div>
      </article>

      <article class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">HISTORY</p>
            <h2>最近紀錄</h2>
          </div>
          <button id="refreshBtn" class="btn btn-ghost" type="button">重新整理</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </article>
    </section>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
