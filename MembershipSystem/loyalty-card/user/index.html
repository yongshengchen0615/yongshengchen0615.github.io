<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>會員集點卡</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOYALTY CARD</p>
        <h1>會員集點卡</h1>
      </div>
      <a class="text-link" href="../admin/">管理端</a>
    </header>

    <section id="configNotice" class="notice notice-warn hidden" role="status"></section>
    <section id="statusNotice" class="notice hidden" aria-live="polite"></section>
    <section id="loadingState" class="loading-card card hidden" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>正在載入會員資料…</span>
    </section>

    <section id="loggedOut" class="hero card">
      <div>
        <p class="eyebrow">LINE LIFF</p>
        <h2>登入後查看你的集點進度</h2>
        <p class="muted">會員身分由 GAS 驗證 LINE ID Token；點數餘額只採用 Server 回傳資料。</p>
      </div>
      <button id="loginBtn" class="btn btn-line" type="button">使用 LINE 登入</button>
    </section>

    <section id="memberArea" class="hidden">
      <article class="profile card">
        <img id="memberAvatar" class="avatar" alt="會員頭像" referrerpolicy="no-referrer">
        <div>
          <p class="eyebrow">MEMBER</p>
          <h2 id="memberName">會員</h2>
          <p id="cardCode" class="mono muted"></p>
          <p id="accountUpdatedAt" class="small muted"></p>
        </div>
        <button id="logoutBtn" class="btn btn-ghost" type="button">登出</button>
      </article>

      <article class="card stamp-card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">POINT BALANCE</p>
            <h2><span id="balance">0</span> 點</h2>
          </div>
          <p id="rewardHint" class="muted"></p>
        </div>
        <div class="progress-wrap">
          <div class="progress-track" aria-hidden="true">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <p id="progressText" class="small muted"></p>
        </div>
        <div id="stampGrid" class="stamp-grid" aria-label="集點進度"></div>
      </article>

      <article class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TRANSACTIONS</p>
            <h2>最近交易</h2>
          </div>
          <button id="refreshBtn" class="btn btn-ghost" type="button">重新整理</button>
        </div>
        <div id="historyList" class="history-list">
          <p class="muted">目前沒有交易紀錄。</p>
        </div>
      </article>
    </section>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
