<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
</head>
<body>
<script>
(() => {
  'use strict';
  const ALLOWED_ORIGIN = <?!= JSON.stringify(allowedOrigin) ?>;
  const ALLOWED_METHODS = new Set([
    'beginLineLogin',
    'completeLogin',
    'getMyCard',
    'logoutSession',
    'adminBootstrap',
    'adminSearchMembers',
    'adminGetMember',
    'adminAdjustPoints'
  ]);

  function respond(id, ok, payload) {
    window.parent.postMessage({
      type: 'loyalty-rpc-result',
      id,
      ok,
      ...(ok ? { result: payload } : { error: String(payload || 'Server error') })
    }, ALLOWED_ORIGIN);
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.origin !== ALLOWED_ORIGIN) return;
    const message = event.data || {};
    if (message.type !== 'loyalty-rpc' || !message.id || !ALLOWED_METHODS.has(message.method)) return;

    google.script.run
      .withSuccessHandler((result) => respond(message.id, true, result))
      .withFailureHandler((error) => respond(message.id, false, error && error.message ? error.message : 'Server error'))
      [message.method](message.payload || {});
  });

  window.parent.postMessage({ type: 'loyalty-bridge-ready' }, ALLOWED_ORIGIN);
})();
</script>
</body>
</html>
