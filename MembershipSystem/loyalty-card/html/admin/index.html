<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://profile.line-scdn.net https://*.line-scdn.net; frame-src https://script.google.com https://script.googleusercontent.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>集點卡管理端</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page="admin" data-config="../../config.json">
  <main class="shell shell-wide">
    <header class="topbar">
      <div>
        <p class="eyebrow">ADMIN CONSOLE</p>
        <h1>集點卡管理端</h1>
      </div>
      <a class="text-link" href="../">用戶端</a>
    </header>

    <section id="configNotice" class="notice notice-warn hidden"></section>
    <section id="statusNotice" class="notice hidden" aria-live="polite"></section>

    <section id="loggedOut" class="hero card">
      <div>
        <p class="eyebrow">STAFF LOGIN</p>
        <h2>使用 LINE 登入管理端</h2>
        <p class="muted">只有 Admins 資料表中啟用的 LINE 帳號可以操作點數。</p>
      </div>
      <button id="loginBtn" class="btn btn-line" type="button">使用 LINE 登入</button>
    </section>

    <section id="adminArea" class="hidden admin-layout">
      <aside class="card admin-sidebar">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">STAFF</p>
            <h2 id="adminName">管理員</h2>
          </div>
          <button id="logoutBtn" class="btn btn-ghost" type="button">登出</button>
        </div>
        <label class="field">
          <span>搜尋會員</span>
          <input id="searchInput" type="search" maxlength="80" placeholder="卡號或顯示名稱">
        </label>
        <button id="searchBtn" class="btn btn-primary" type="button">搜尋</button>
        <div id="searchResults" class="search-results"></div>
      </aside>

      <section class="card admin-main">
        <div id="emptySelection" class="empty-state">
          <h2>選擇會員</h2>
          <p class="muted">先從左側搜尋會員，再執行集點、扣點或兌換。</p>
        </div>

        <div id="memberEditor" class="hidden">
          <div class="section-heading">
            <div>
              <p class="eyebrow">MEMBER</p>
              <h2 id="selectedName"></h2>
              <p id="selectedCardCode" class="mono muted"></p>
            </div>
            <div class="balance-badge"><span id="selectedBalance">0</span> 點</div>
          </div>

          <div class="action-grid">
            <button class="btn btn-primary point-action" data-action="earn" data-amount="1" type="button">+1 點</button>
            <button class="btn btn-primary point-action" data-action="earn" data-amount="5" type="button">+5 點</button>
            <button class="btn btn-danger point-action" data-action="remove" data-amount="1" type="button">-1 點</button>
            <button id="redeemBtn" class="btn btn-accent point-action" data-action="redeem" data-amount="0" type="button">兌換獎勵</button>
          </div>

          <label class="field">
            <span>操作原因</span>
            <input id="reasonInput" type="text" maxlength="120" placeholder="例如：消費集點、人工更正">
          </label>

          <div class="history-list" id="selectedHistory"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="../../js/app.js"></script>
</body>
</html>
